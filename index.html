s=\"mc-sub\">kontrak BTC aktif<\/div>\n      <div class=\"mc-bar\" style=\"background:var(--blue);\"><\/div>\n    <\/div>\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">Long/Short Ratio<\/div>\n      <div class=\"mc-val\" id=\"mc-ls\">—<\/div>\n      <div class=\"mc-sub\" id=\"mc-ls-sub\">akun retail<\/div>\n      <div class=\"mc-bar\" id=\"bar-ls\" style=\"background:var(--border2);\"><\/div>\n    <\/div>\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">Fear &amp; Greed<\/div>\n      <div class=\"mc-val\" id=\"mc-fng\">—<\/div>\n      <div class=\"mc-sub\" id=\"mc-fng-sub\">memuat...<\/div>\n      <div class=\"mc-bar\" id=\"bar-fng\" style=\"background:var(--border2);\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- FEAR GREED SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\"><div class=\"sec-title\"><i class=\"ti ti-mood-sad\" style=\"color:var(--amber);\"><\/i> Fear &amp; Greed Index<\/div><\/div>\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Indeks komposit sentimen crypto skala 0-100 (volatilitas, momentum, sosmed, dominance, dll). Data: alternative.me, update harian. Sifatnya <b>telat dan noisy<\/b>, jadi pakai sebagai satu konfirmasi, bukan trigger tunggal.<\/p>\n    <\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">0-24<\/span><span class=\"read-desc\">Extreme Fear. Zona yang sering dekat bottom, tapi bisa bertahan lama. Kombinasikan dengan volume capitulation dan funding negatif.<\/span><\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">25-49<\/span><span class=\"read-desc\">Fear. Pasar defensif, belum capitulation.<\/span><\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">50-74<\/span><span class=\"read-desc\">Neutral sampai Greed. Normal di fase uptrend.<\/span><\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--blue-dim);color:var(--blue);\">75+<\/span><span class=\"read-desc\">Extreme Greed. Rawan euforia dan koreksi.<\/span><\/div>\n  <\/div>\n\n  <!-- FUNDING RATE SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-flame\"><\/i> Funding Rate<\/div>\n      <div class=\"sec-gauge\">\n        <span class=\"gauge-label\" id=\"funding-gauge\" style=\"background:var(--bg2);color:var(--text3);\">—<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Funding rate adalah biaya yang dibayar antara trader <b>long<\/b> dan <b>short<\/b> di kontrak perpetual futures, setiap 8 jam. Ini bukan biaya exchange — ini <b>uang yang berpindah dari satu sisi ke sisi lain.<\/b><\/p>\n      <p><b>Positif<\/b> = long yang bayar short (market kebanyakan long, bullish crowded). <b>Negatif<\/b> = short yang bayar long (market kebanyakan short, bearish crowded).<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">Netral<\/span>\n      <span class=\"read-desc\">Funding di kisaran ±0.01% — market balance, tidak ada crowded positioning yang ekstrem.<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Waspada<\/span>\n      <span class=\"read-desc\">Funding sangat negatif (di bawah -0.05%) — banyak short terbuka. Ini \"bensin\" untuk short squeeze kalau ada trigger naik sedikit saja. <b>Ini yang terjadi sebelum rally Juli kemarin.<\/b><\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">Overheat<\/span>\n      <span class=\"read-desc\">Funding sangat positif (di atas 0.05-0.1%) — terlalu banyak long crowded. Rawan long liquidation cascade kalau harga sedikit koreksi.<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- OPEN INTEREST SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-stack\" style=\"color:var(--blue);\"><\/i> Open Interest<\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Total jumlah kontrak futures BTC yang masih terbuka (belum di-close). Ini <b>ukuran total \"taruhan\" leverage yang aktif<\/b> di market — bukan volume transaksi, tapi posisi yang masih hidup.<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca (kombinasi dengan price)<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">Sehat<\/span>\n      <span class=\"read-desc\">Harga naik + OI naik = fresh money masuk, rally didukung posisi baru (genuine demand).<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Rapuh<\/span>\n      <span class=\"read-desc\">Harga naik + OI turun = rally didorong short covering / short squeeze, bukan buying baru. Biasanya kurang sustainable. <b>Ini pola yang sempat kita bahas soal rally 10 Juli yang stalling.<\/b><\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">Awas<\/span>\n      <span class=\"read-desc\">OI meledak sangat cepat dalam waktu singkat = leverage menumpuk agresif, biasanya mendahului volatilitas besar (naik atau turun).<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- LONG SHORT RATIO SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-scale\" style=\"color:var(--purple, #4a3070);\"><\/i> Long/Short Ratio<\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Perbandingan jumlah akun retail yang posisi <b>long<\/b> vs <b>short<\/b> di Binance Futures. Rasio 1.5 artinya untuk setiap 1 akun short, ada 1.5 akun long.<\/p>\n      <p>Sering dipakai sebagai <b>contrarian indicator<\/b> — retail crowd sering salah di titik ekstrem.<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">Normal<\/span>\n      <span class=\"read-desc\">Rasio 0.8 - 1.3 — positioning retail seimbang, tidak ada sinyal ekstrem.<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Ekstrem<\/span>\n      <span class=\"read-desc\">Rasio di atas 2.0 (terlalu banyak long) atau di bawah 0.6 (terlalu banyak short) — crowd terlalu satu arah, rawan kena \"flush\" sebaliknya.<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- LIQUIDATION HEATMAP SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-map-2\" style=\"color:var(--red);\"><\/i> Liquidation Heatmap<\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Peta visual yang menunjukkan <b>di harga berapa saja<\/b> banyak posisi leverage akan ke-liquidate. Cluster besar di suatu level harga = \"target magnet\" yang sering ditarik oleh market (liquidity hunt).<\/p>\n      <p>Data ini tidak tersedia via API gratis untuk di-embed langsung — harus dicek manual di platform seperti Coinglass. Tapi ini <b>gratis untuk dilihat<\/b>, cuma tidak bisa auto-refresh di dashboard ini.<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">Merah tebal<\/span>\n      <span class=\"read-desc\">Cluster liquidation besar di level tersebut — kalau harga menembus, kemungkinan ada cascade effect (harga bergerak cepat menuju level itu).<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--blue-dim);color:var(--blue);\">Di atas harga<\/span>\n      <span class=\"read-desc\">Cluster di atas harga sekarang = short liquidation zone. Kalau ditembus ke atas, short squeeze bisa terjadi (seperti Juli kemarin).<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Di bawah harga<\/span>\n      <span class=\"read-desc\">Cluster di bawah harga sekarang = long liquidation zone. Kalau ditembus ke bawah, long squeeze / flush cepat bisa terjadi.<\/span>\n    <\/div>\n\n    <div class=\"link-card\">\n      <div class=\"link-left\">\n        <div class=\"link-icon\"><i class=\"ti ti-external-link\"><\/i><\/div>\n        <div>\n          <div class=\"link-title\">Coinglass Liquidation Heatmap<\/div>\n          <div class=\"link-desc\">Gratis, real-time, tidak perlu akun untuk versi basic<\/div>\n        <\/div>\n      <\/div>\n      <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" class=\"link-btn\">Buka <i class=\"ti ti-arrow-up-right\"><\/i><\/a>\n    <\/div>\n  <\/div>\n\n  <!-- SUMMARY PLAYBOOK -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-checklist\"><\/i> Playbook Pagi — 3 Menit<\/div>\n    <\/div>\n    <div class=\"explain\" style=\"border-left-color:var(--green-border);\">\n      <p><b>1. Cek funding rate di sini<\/b> — kalau sangat negatif (< -0.05%), ada fuel buat short squeeze.<\/p>\n      <p><b>2. Bandingkan OI dengan price<\/b> — harga naik tapi OI turun = rally rapuh (short covering), bukan demand asli.<\/p>\n      <p><b>3. Buka Coinglass heatmap<\/b> — lihat cluster liquidation terdekat di atas & bawah harga sekarang. Itu magnet yang paling mungkin ditarik duluan.<\/p>\n    <\/div>\n  <\/div>\n\n  <!-- FOOTER -->\n  <div class=\"footer\">\n    <p>BTC Fuel Gauge · Data: Binance Futures Public API (BTCUSDT Perpetual) · Update tiap refresh<\/p>\n    <span>Bukan financial advice.<\/span>\n  <\/div>\n  <div class=\"disclaimer\">\n    Funding rate & OI ekstrem menunjukkan potensi \"bahan bakar\" untuk pergerakan cepat — bukan prediksi arah. Kombinasikan dengan struktur teknikal dan konteks makro sebelum ambil keputusan.\n  <\/div>\n\n<\/div>\n\n<\/div>\n<div id=\"tab-matrix\" class=\"tabpane\"><div class=\"w\">\n<div class=\"eb\">BTC/USD · Calendar Matrix<\/div>\n<h1>Time Matrix <em>Q1 — Q2<\/em> 2027<\/h1>\n<div class=\"sub\">9 layer waktu: Fib ratio &amp; Fib/Lucas count · Gann (1/8 tahun, anniversary, musiman) · Geometry (Square of 9, time = price) · Hurst cycle · Bradley siderograph · Astro · 500-day rule · analog siklus · FOMC &amp; opex<\/div>\n\n<div class=\"warn\"><b>Review Okt–Des 2026.<\/b> Cluster utama 14-16 Nov ternyata 5 hari lebih awal dari low 21 Nov ($55.1k, data Crypto.com), dan masih di dalam window analog siklus. Ada juga yang perlu dikoreksi: anchor A (2 Apr) dan B (10 Mei) basisnya sama-sama 38 hari dan jaraknya juga 38 hari. Jadi A×(n+1) selalu jatuh di tanggal yang sama dengan B×n, dan konfluensi \"dua anchor\" di 16 Nov dan 24 Des itu sebenernya cuma satu layer yang kehitung dua kali. Di matrix 2027 tiap layer dihitung sekali saja. Tetap pakai ini sebagai <b>kalender buat perhatiin price action<\/b>, bukan sinyal arah.<\/div>\n\n<div class=\"mt\"><em>Layer<\/em> waktu<\/div>\n<table>\n<tr><th>Layer<\/th><th>Isi<\/th><th>Catatan<\/th><\/tr>\n<tr><td>Fib<\/td><td>Ratio: low + 411 hari × 0.146/0.236/0.382/0.5. Count: hari ke-55, 89, 144 (Fibonacci) dan 47, 76, 123, 199 (Lucas) dari low<\/td><td>Anchor ATH 6 Okt 2025 → low 21 Nov 2026<\/td><\/tr>\n<tr><td>Gann<\/td><td>Kelipatan 45 hari (1/8 tahun) dari low dan dari ATH, anniversary 1 tahun pivot 2026 (2 Apr, 10 Mei, 27 Mei), tanggal musiman: cross-quarter 4 Feb dan 5 Mei, equinox 21 Mar, solstice 21 Jun<\/td><td>Musiman dihitung ephem<\/td><\/tr>\n<tr><td>Geometry<\/td><td>Square of 9: hari ke-n² dari low (49, 64, 81, 100, 121, 144, 169, 196). Time = price: low $55.1k → 55 hari, range ATH−low $71.1k → 71 hari<\/td><td>Skala $1.000 = 1 hari itu pilihan bebas, bobot kecil<\/td><\/tr>\n<tr><td>Hurst<\/td><td>Trough nominal dari low: 40 hari, 80 hari, 20 minggu (140 hari)<\/td><td>Siklus Hurst melar ±10-15%, jadi tanggalnya kira-kira<\/td><\/tr>\n<tr><td>Bradley<\/td><td>Titik balik siderograph (aspek planet Mercury–Pluto + deklinasi Venus/Mars), 6 turn terbesar di H1<\/td><td>Implementasi aproksimasi gw sendiri. Turn = waktu, bukan arah<\/td><\/tr>\n<tr><td>Astro<\/td><td>New/full moon, Mercury retro 11 Feb-5 Mar dan 12 Jun-6 Jul, Mars retro 12 Jan-3 Apr, Jupiter direct 14 Apr<\/td><td>ephem, WIB<\/td><\/tr>\n<tr><td>500-day<\/td><td>T-450, T-400, T-365, T-300 dari estimasi halving 11 Apr 2028<\/td><td>Sama dengan tab Simulator<\/td><\/tr>\n<tr><td>Analog<\/td><td>Hari ke-N dari low yang jadi titik balik di 2019 (low 15 Des 2018) dan 2023 (low 21 Nov 2022)<\/td><td>2 sampel<\/td><\/tr>\n<tr><td>Makro<\/td><td>Keputusan FOMC (WIB): 28 Jan, 18 Mar, 29 Apr, 10 Jun. Opex kuartalan 26 Mar dan 25 Jun<\/td><td>federalreserve.gov, Deribit<\/td><\/tr>\n<\/table>\n<div class=\"warn\" style=\"margin-top:1rem\"><b>Cara hitung skor.<\/b> Skor = jumlah layer berbeda yang kena dalam ±1 hari. Kalau beberapa metode jatuh di <b>angka hari yang sama dari low<\/b> (misal Fib 144, Sq9 144 = 12², analog +144), itu dihitung 1, karena sebenernya satu hitungan yang sama. <b>Baseline:<\/b> dengan 9 layer, 12 dari 181 hari di H1 (7%) udah punya skor ≥3, dan cuma 2 hari yang skornya ≥4. Jadi skor 3 itu biasa aja. Yang beda dari \"kebetulan\" cuma yang ≥4. <b>Koreksi dari versi sebelumnya:<\/b> cluster 12-16 Jun yang tadinya 4 layer turun jadi 2 setelah dedup (Fib 0.5 dan analog +206 itu sama-sama hari ke-206), plus Mercury retro 12 Jun jatuh 3 hari di luar toleransi.<\/div>\n<div class=\"mt\"><em>Heatmap<\/em> Jan — Jun<\/div>\n<div class=\"hs\"><div class=\"hr\"><span class=\"hm\">Jan<\/span><div class=\"hc\"><i style=\"background:var(--bg2)\" title=\"1 Jan: - | skor ±1 hari: 0\"><\/i><i style=\"background:var(--bg2)\" title=\"2 Jan: - | skor ±1 hari: 0\"><\/i><i style=\"background:var(--bg2)\" title=\"3 Jan: - | skor ±1 hari: 0\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"4 Jan: - | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"5 Jan: Gann 45d low | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"6 Jan: - | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"7 Jan: Lucas 47 | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.7)\" title=\"8 Jan: New Moon ♑ | skor ±1 hari: 3\">8<\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"9 Jan: Sq9 49 | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"10 Jan: - | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"11 Jan: - | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"12 Jan: Mars ℞ | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"13 Jan: Analog 2023 +53 | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.7)\" title=\"14 Jan: - | skor ±1 hari: 3\">14<\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"15 Jan: Fib 55, Time=price 55d, Bradley ce?instType=SWAP&instId='+id),\n      jget(B+'public/open-interest?instType=SWAP&instId='+id),\n      jget(B+'rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=1H')]);\n    const r={};\n    if(f.status==='fulfilled')r.funding=parseFloat(f.value.data[0].fundingRate)*100;\n    if(m.status==='fulfilled')r.price=parseFloat(m.value.data[0].markPx);\n    if(o.status==='fulfilled')r.oi=parseFloat(o.value.data[0].oiCcy);\n    if(l.status==='fulfilled')r.ls=parseFloat(l.value.data[0][1]);\n    if(!Object.keys(r).length)throw new Error('semua endpoint gagal');\n    return r;},\n  bybit:async()=>{\n    const B='https://api.bybit.com/v5/market/';\n    const [t,l]=await Promise.allSettled([\n      jget(B+'tickers?category=linear&symbol=BTCUSDT'),\n      jget(B+'account-ratio?category=linear&symbol=BTCUSDT&period=1h&limit=1')]);\n    const r={};\n    if(t.status==='fulfilled'){const x=t.value.result.list[0];r.price=+x.markPrice;r.funding=+x.fundingRate*100;r.oi=+x.openInterest;}\n    if(l.status==='fulfilled'){const x=l.value.result.list[0];r.ls=+x.buyRatio/+x.sellRatio;}\n    if(!Object.keys(r).length)throw new Error('semua endpoint gagal');\n    return r;},\n  hyperliquid:async()=>{\n    const d=await jget('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'metaAndAssetCtxs'})});\n    const i=d[0].universe.findIndex(u=>u.name==='BTC');const c=d[1][i];\n    return{price:+c.markPx,funding:+c.funding*8*100,oi:+c.openInterest};}, // HL funding per jam, dikali 8 = setara 8 jam\n  binance:async()=>{\n    const B='https://fapi.binance.com/';\n    const [p,o,l]=await Promise.allSettled([\n      jget(B+'fapi/v1/premiumIndex?symbol=BTCUSDT'),\n      jget(B+'fapi/v1/openInterest?symbol=BTCUSDT'),\n      jget(B+'futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=1')]);\n    const r={};\n    if(p.status==='fulfilled'){r.price=+p.value.markPrice;r.funding=+p.value.lastFundingRate*100;}\n    if(o.status==='fulfilled')r.oi=+o.value.openInterest;\n    if(l.status==='fulfilled')r.ls=+l.value[0].longShortRatio;\n    if(!Object.keys(r).length)throw new Error('semua endpoint gagal');\n    return r;}\n};\nasync function doRefresh(){\n  const ic=document.getElementById('ric'),btn=document.getElementById('rbtn');\n  ic.classList.add('spin');btn.disabled=true;\n  document.getElementById('mc-time').textContent='memuat...';\n  const order=['okx','bybit','hyperliquid','binance'];\n  const res=await Promise.allSettled(order.map(k=>PROV[k]()));\n  const data={},src={},log=[];\n  res.forEach((r,i)=>{\n    if(r.status==='fulfilled'){\n      for(const k of ['price','funding','oi','ls']){\n        if(data[k]===undefined&&r.value[k]!==undefined&&!isNaN(r.value[k])){data[k]=r.value[k];src[k]=order[i];}}\n      log.push(order[i]+': OK');\n    }else log.push(order[i]+': GAGAL ('+(r.reason&&r.reason.message||r.reason)+')');\n  });\n  let dbg=document.getElementById('dbg');\n  if(!dbg){dbg=document.createElement('div');dbg.id='dbg';dbg.style.cssText='font-size:10px;color:#a8a29c;margin:-10px 0 18px;line-height:1.7;letter-spacing:.03em';\n    document.querySelector('#tab-fuel .metrics').after(dbg);}\n  dbg.textContent='Status sumber → '+log.join(' · ');\n  if(data.price!==undefined){document.getElementById('mc-price').textContent=fmt(data.price);document.getElementById('mc-time').textContent=(src.price||'').toUpperCase()+' · '+new Date().toLocaleTimeString('id-ID');}\n  else{document.getElementById('mc-price').textContent='Error';document.getElementById('mc-time').textContent='semua sumber gagal';}\n  if(data.oi!==undefined)document.getElementById('mc-oi').textContent=fmtNum(data.oi)+' BTC';\n  if(data.funding!==undefined){\n    const fr=data.funding,el=document.getElementById('mc-funding'),bar=document.getElementById('bar-funding'),g=document.getElementById('funding-gauge');\n    el.textContent=(fr>=0?'+':'')+fr.toFixed(4)+'%';\n    const set=(c,d,t)=>{el.style.color=c;bar.style.background=c;g.textContent=t;g.style.background=d;g.style.color=c;};\n    if(fr<=-0.05)set('var(--amber)','var(--amber-dim)','⚠️ Waspada — Short Crowded');\n    else if(fr>=0.05)set('var(--red)','var(--red-dim)','🔥 Overheat — Long Crowded');\n    else set('var(--green)','var(--green-dim)','✓ Netral');\n  }\n  if(data.ls!==undefined){\n    const r=data.ls;document.getElementById('mc-ls').textContent=r.toFixed(2);\n    const b=document.getElementById('bar-ls'),sb=document.getElementById('mc-ls-sub');\n    if(r>=2||r<=0.6){b.style.background='var(--amber)';sb.textContent='Ekstrem — '+(r>=2?'long':'short')+' dominan';sb.style.color='var(--amber)';}\n    else{b.style.background='var(--green)';sb.textContent='Normal — seimbang';sb.style.color='var(--text3)';}\n  }\n  ic.classList.remove('spin');btn.disabled=false;\n  document.getElementById('ts').textContent=new Date().toLocaleTimeString('id-ID');\n}\nasync function fng(){\n  try{\n    const d=(await jget('https://api.alternative.me/fng/?limit=2')).data;\n    const v=parseInt(d[0].value), y=parseInt(d[1].value);\n    document.getElementById('mc-fng').textContent=v;\n    const sub=document.getElementById('mc-fng-sub');\n    sub.textContent=d[0].value_classification+' (kemarin '+y+')';\n    const b=document.getElementById('bar-fng');\n    b.style.background= v<25?'var(--red)':v<50?'var(--amber)':v<75?'var(--green)':'var(--blue)';\n  }catch(e){document.getElementById('mc-fng').textContent='Error';document.getElementById('mc-fng-sub').textContent=e.message;}\n}\ndoRefresh();\nfng();\n\ndocument.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('on'));\n  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on');\n  window.scrollTo(0,0);\n}));\n<\/script><style>.tabs{display:none!important}<\/style><script>addEventListener('DOMContentLoaded',function(){var b=document.querySelector('.tabbtn[data-t=\"tab-fuel\"]');if(b)b.click();});<\/script><\/body><\/html>", "matrix": "<!DOCTYPE html>\n<html lang=\"id\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>BTC Dashboard — Fuel Gauge + Time Matrix 2027<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap\" rel=\"stylesheet\">\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css\">\n<style>\n*{box-sizing:border-box;margin:0;padding:0;}\n:root{\n  --bg:#fafaf8;--bg2:#f5f4f0;--bg3:#eeecea;\n  --border:#e0ddd8;--border2:#d0ccc5;\n  --text:#1a1714;--text2:#6b6560;--text3:#a8a29c;\n  --gold:#b8860b;--gold2:#d4a017;\n  --gold-dim:rgba(184,134,11,0.08);--gold-border:rgba(184,134,11,0.22);\n  --green:#1a6b47;--green-dim:rgba(26,107,71,0.08);--green-border:rgba(26,107,71,0.2);\n  --red:#8b2020;--red-dim:rgba(139,32,32,0.08);--red-border:rgba(139,32,32,0.2);\n  --amber:#7a5000;--amber-dim:rgba(122,80,0,0.08);--amber-border:rgba(122,80,0,0.2);\n  --blue:#1a3a6b;--blue-dim:rgba(26,58,107,0.08);--blue-border:rgba(26,58,107,0.2);\n  --shadow:0 1px 4px rgba(0,0,0,0.06),0 4px 20px rgba(0,0,0,0.04);\n}\nhtml{scroll-behavior:smooth;}\nbody{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;}\nbody::before{content:'';position:fixed;inset:0;\n  background:radial-gradient(ellipse at 10% 0%,rgba(184,134,11,0.04) 0%,transparent 50%),\n             radial-gradient(ellipse at 90% 100%,rgba(184,134,11,0.03) 0%,transparent 50%);\n  pointer-events:none;z-index:0;}\n.wrap{max-width:920px;margin:0 auto;padding:2.5rem 1.75rem 5rem;position:relative;z-index:1;}\n\n/* HEADER */\n.header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:2rem;padding-bottom:1.75rem;border-bottom:1px solid var(--border);}\n.h-eyebrow{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:8px;}\n.h-eyebrow::before{content:'';width:20px;height:1px;background:var(--gold);}\n.h-title{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:300;color:var(--text);line-height:1.15;}\n.h-title em{font-style:italic;color:var(--gold);}\n.h-sub{font-size:10px;color:var(--text3);margin-top:6px;letter-spacing:.05em;line-height:1.7;}\n.h-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:4px;}\n.live-row{display:flex;align-items:center;gap:7px;}\n.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.5s ease-in-out infinite;}\n@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}\n.live-txt{font-size:10px;letter-spacing:.06em;color:var(--text3);}\n.rbtn{display:flex;align-items:center;gap:5px;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.04em;padding:7px 14px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s;}\n.rbtn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}\n.rbtn:disabled{opacity:.4;cursor:default;}\n.rbtn i{font-size:13px;}\n.spin{animation:spin 1s linear infinite;}\n@keyframes spin{to{transform:rotate(360deg);}}\n\n/* METRICS */\n.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:1.5rem;box-shadow:var(--shadow);}\n.mc{background:var(--bg);padding:16px 18px;position:relative;}\n.mc-lbl{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;}\n.mc-val{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--text);line-height:1;}\n.mc-sub{font-size:10px;color:var(--text3);margin-top:5px;}\n.mc-bar{position:absolute;bottom:0;left:0;right:0;height:2px;}\n\n/* SECTION */\n.section{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow);}\n.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}\n.sec-title{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;color:var(--text);display:flex;align-items:center;gap:8px;}\n.sec-title i{color:var(--gold);font-size:18px;}\n.sec-gauge{display:flex;align-items:center;gap:8px;}\n.gauge-label{font-size:10px;letter-spacing:.06em;padding:3px 10px;border-radius:20px;font-weight:500;}\n\n/* explanation box */\n.explain{background:var(--bg2);border-left:2px solid var(--gold-border);border-radius:2px;padding:12px 16px;margin-bottom:14px;}\n.explain-title{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:5px;}\n.explain p{font-size:11px;color:var(--text2);line-height:1.8;margin-bottom:6px;}\n.explain p:last-child{margin-bottom:0;}\n.explain b{color:var(--text);font-weight:500;}\n\n/* reading guide rows */\n.read-row{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;}\n.read-row:last-child{border-bottom:none;}\n.read-tag{font-size:9px;padding:2px 8px;border-radius:2px;flex-shrink:0;width:70px;text-align:center;letter-spacing:.03em;}\n.read-desc{color:var(--text2);line-height:1.6;flex:1;}\n\n/* link out card */\n.link-card{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:4px;padding:14px 18px;margin-top:10px;transition:border-color .15s;}\n.link-card:hover{border-color:var(--gold-border);}\n.link-left{display:flex;align-items:center;gap:12px;}\n.link-icon{width:34px;height:34px;border-radius:8px;background:var(--gold-dim);display:flex;align-items:center;justify-content:center;flex-shrink:0;}\n.link-icon i{color:var(--gold);font-size:17px;}\n.link-title{font-family:'Cormorant Garamond',serif;font-size:15px;font-weight:500;color:var(--text);}\n.link-desc{font-size:10px;color:var(--text3);margin-top:2px;}\n.link-btn{font-size:10px;letter-spacing:.05em;padding:6px 14px;border-radius:2px;border:1px solid var(--border2);color:var(--text2);text-decoration:none;transition:all .15s;flex-shrink:0;white-space:nowrap;}\n.link-btn:hover{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}\n\n/* footer */\n.footer{margin-top:2.5rem;padding-top:1.25rem;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}\n.footer p,.footer span{font-size:10px;color:var(--text3);letter-spacing:.05em;}\n.disclaimer{margin-top:8px;font-size:10px;color:var(--text3);font-style:italic;padding:8px 12px;border-left:2px solid var(--border2);}\n\n@media(max-width:600px){.wrap{padding:1.25rem 1rem 3rem;}.h-title{font-size:24px;}.mc-val{font-size:19px;}}\n\n\n.tabs{position:sticky;top:0;z-index:50;background:rgba(250,250,248,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--border);display:flex;justify-content:center;gap:8px;padding:10px 12px}\n.tabbtn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.05em;padding:7px 16px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--text2);cursor:pointer;transition:all .15s}\n.tabbtn:hover{border-color:var(--gold);color:var(--gold)}\n.tabbtn.on{background:var(--text);color:var(--bg);border-color:var(--text)}\n.tabpane{display:none}.tabpane.on{display:block}\n\n:root{--bg:#fafaf8;--bg2:#f5f4f0;--b:#e0ddd8;--b2:#d0ccc5;--t:#1a1714;--t2:#6b6560;--t3:#a8a29c;--gold:#b8860b;--gd:rgba(184,134,11,.08);--gb:rgba(184,134,11,.25);--red:#8b2020;--rd:rgba(139,32,32,.08);--am:#7a5000;--ad:rgba(122,80,0,.08);--bl:#1a3a6b;--bd:rgba(26,58,107,.08);--pu:#4a3070;--pd:rgba(74,48,112,.08);--gr:#1a6b47;--grd:rgba(26,107,71,.08)}\n#tab-matrix .w{max-width:880px;margin:0 auto;padding:2.5rem 1.5rem 4rem}\n#tab-matrix .eb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}\n#tab-matrix h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:300;line-height:1.15}\n#tab-matrix h1 em{font-style:italic;color:var(--gold)}\n#tab-matrix .sub{font-size:10px;color:var(--t3);margin:8px 0 1.5rem;line-height:1.8}\n#tab-matrix .warn{background:var(--ad);border-left:3px solid var(--am);padding:14px 16px;margin-bottom:1.5rem;font-size:11px;line-height:1.8;color:var(--t2)}\n#tab-matrix .warn b{color:var(--t)}\n#tab-matrix table{width:100%;border-collapse:collapse;font-size:10px;margin-top:8px}\n#tab-matrix td,#tab-matrix th{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;vertical-align:top}\n#tab-matrix th{color:var(--t3);font-weight:400;letter-spacing:.08em;text-transform:uppercase;font-size:9px}\n#tab-matrix td.x{color:var(--red);text-decoration:line-through}\n#tab-matrix td.o{color:var(--gr)}\n#tab-matrix .mt{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:300;margin:2rem 0 .8rem;padding-bottom:.5rem;border-bottom:1px solid var(--b)}\n#tab-matrix .mt em{font-style:italic;color:var(--gold)}\n#tab-matrix .c{display:flex;border:1px solid var(--b);border-radius:4px;margin-bottom:8px;background:var(--bg);overflow:hidden}\n#tab-matrix .c.s{border-color:var(--gb);box-shadow:0 1px 8px rgba(184,134,11,.1)}\n#tab-matrix .st{width:4px;flex-shrink:0}\n#tab-matrix .d{width:84px;flex-shrink:0;padding:12px;background:var(--bg2);border-right:1px solid var(--b)}\n#tab-matrix .d b{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:400;display:block;line-height:1}\n#tab-matrix .d span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}\n#tab-matrix .bd{flex:1;padding:12px 14px}\n# ;flex-shrink:0;padding:12px 6px;text-align:center;border-left:1px solid var(--b);font-size:9px;color:var(--t3)}\n#tab-matrix .sc i{display:block;font-style:normal;color:var(--gold);font-size:11px;margin-bottom:2px}\n#tab-matrix .ft{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--b);font-size:10px;color:var(--t3);line-height:1.8;font-style:italic}\n<\/style><\/head><body>\n<div class=\"tabs\"><button class=\"tabbtn on\" data-t=\"tab-fuel\">Fuel Gauge<\/button><button class=\"tabbtn\" data-t=\"tab-matrix\">Time Matrix 2027<\/button><\/div>\n<div id=\"tab-fuel\" class=\"tabpane on\">\n<div class=\"wrap\">\n\n  <!-- HEADER -->\n  <div class=\"header\">\n    <div>\n      <div class=\"h-eyebrow\"><i class=\"ti ti-gauge\"><\/i> Leverage Pressure Monitor<\/div>\n      <h1 class=\"h-title\">BTC Fuel <em>Gauge<\/em><\/h1>\n      <p class=\"h-sub\">Funding Rate · Open Interest · Long/Short Ratio — real-time, gratis, tanpa API key<br>Data: Binance Futures Public API<\/p>\n    <\/div>\n    <div class=\"h-right\">\n      <div class=\"live-row\">\n        <div class=\"live-dot\"><\/div>\n        <span class=\"live-txt\" id=\"ts\">—<\/span>\n      <\/div>\n      <button class=\"rbtn\" onclick=\"doRefresh();fng()\" id=\"rbtn\">\n        <i class=\"ti ti-refresh\" id=\"ric\"><\/i> Refresh\n      <\/button>\n    <\/div>\n  <\/div>\n\n  <!-- METRICS -->\n  <div class=\"metrics\">\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">BTC Mark Price<\/div>\n      <div class=\"mc-val\" id=\"mc-price\">$—<\/div>\n      <div class=\"mc-sub\" id=\"mc-time\">memuat...<\/div>\n      <div class=\"mc-bar\" style=\"background:var(--gold);\"><\/div>\n    <\/div>\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">Funding Rate<\/div>\n      <div class=\"mc-val\" id=\"mc-funding\">—<\/div>\n      <div class=\"mc-sub\" id=\"mc-funding-sub\">per 8 jam<\/div>\n      <div class=\"mc-bar\" id=\"bar-funding\" style=\"background:var(--border2);\"><\/div>\n    <\/div>\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">Open Interest<\/div>\n      <div class=\"mc-val\" id=\"mc-oi\">—<\/div>\n      <div class=\"mc-sub\">kontrak BTC aktif<\/div>\n      <div class=\"mc-bar\" style=\"background:var(--blue);\"><\/div>\n    <\/div>\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">Long/Short Ratio<\/div>\n      <div class=\"mc-val\" id=\"mc-ls\">—<\/div>\n      <div class=\"mc-sub\" id=\"mc-ls-sub\">akun retail<\/div>\n      <div class=\"mc-bar\" id=\"bar-ls\" style=\"background:var(--border2);\"><\/div>\n    <\/div>\n    <div class=\"mc\">\n      <div class=\"mc-lbl\">Fear &amp; Greed<\/div>\n      <div class=\"mc-val\" id=\"mc-fng\">—<\/div>\n      <div class=\"mc-sub\" id=\"mc-fng-sub\">memuat...<\/div>\n      <div class=\"mc-bar\" id=\"bar-fng\" style=\"background:var(--border2);\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- FEAR GREED SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\"><div class=\"sec-title\"><i class=\"ti ti-mood-sad\" style=\"color:var(--amber);\"><\/i> Fear &amp; Greed Index<\/div><\/div>\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Indeks komposit sentimen crypto skala 0-100 (volatilitas, momentum, sosmed, dominance, dll). Data: alternative.me, update harian. Sifatnya <b>telat dan noisy<\/b>, jadi pakai sebagai satu konfirmasi, bukan trigger tunggal.<\/p>\n    <\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">0-24<\/span><span class=\"read-desc\">Extreme Fear. Zona yang sering dekat bottom, tapi bisa bertahan lama. Kombinasikan dengan volume capitulation dan funding negatif.<\/span><\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">25-49<\/span><span class=\"read-desc\">Fear. Pasar defensif, belum capitulation.<\/span><\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">50-74<\/span><span class=\"read-desc\">Neutral sampai Greed. Normal di fase uptrend.<\/span><\/div>\n    <div class=\"read-row\"><span class=\"read-tag\" style=\"background:var(--blue-dim);color:var(--blue);\">75+<\/span><span class=\"read-desc\">Extreme Greed. Rawan euforia dan koreksi.<\/span><\/div>\n  <\/div>\n\n  <!-- FUNDING RATE SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-flame\"><\/i> Funding Rate<\/div>\n      <div class=\"sec-gauge\">\n        <span class=\"gauge-label\" id=\"funding-gauge\" style=\"background:var(--bg2);color:var(--text3);\">—<\/span>\n      <\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Funding rate adalah biaya yang dibayar antara trader <b>long<\/b> dan <b>short<\/b> di kontrak perpetual futures, setiap 8 jam. Ini bukan biaya exchange — ini <b>uang yang berpindah dari satu sisi ke sisi lain.<\/b><\/p>\n      <p><b>Positif<\/b> = long yang bayar short (market kebanyakan long, bullish crowded). <b>Negatif<\/b> = short yang bayar long (market kebanyakan short, bearish crowded).<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">Netral<\/span>\n      <span class=\"read-desc\">Funding di kisaran ±0.01% — market balance, tidak ada crowded positioning yang ekstrem.<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Waspada<\/span>\n      <span class=\"read-desc\">Funding sangat negatif (di bawah -0.05%) — banyak short terbuka. Ini \"bensin\" untuk short squeeze kalau ada trigger naik sedikit saja. <b>Ini yang terjadi sebelum rally Juli kemarin.<\/b><\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">Overheat<\/span>\n      <span class=\"read-desc\">Funding sangat positif (di atas 0.05-0.1%) — terlalu banyak long crowded. Rawan long liquidation cascade kalau harga sedikit koreksi.<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- OPEN INTEREST SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-stack\" style=\"color:var(--blue);\"><\/i> Open Interest<\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Total jumlah kontrak futures BTC yang masih terbuka (belum di-close). Ini <b>ukuran total \"taruhan\" leverage yang aktif<\/b> di market — bukan volume transaksi, tapi posisi yang masih hidup.<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca (kombinasi dengan price)<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">Sehat<\/span>\n      <span class=\"read-desc\">Harga naik + OI naik = fresh money masuk, rally didukung posisi baru (genuine demand).<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Rapuh<\/span>\n      <span class=\"read-desc\">Harga naik + OI turun = rally didorong short covering / short squeeze, bukan buying baru. Biasanya kurang sustainable. <b>Ini pola yang sempat kita bahas soal rally 10 Juli yang stalling.<\/b><\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">Awas<\/span>\n      <span class=\"read-desc\">OI meledak sangat cepat dalam waktu singkat = leverage menumpuk agresif, biasanya mendahului volatilitas besar (naik atau turun).<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- LONG SHORT RATIO SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-scale\" style=\"color:var(--purple, #4a3070);\"><\/i> Long/Short Ratio<\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Perbandingan jumlah akun retail yang posisi <b>long<\/b> vs <b>short<\/b> di Binance Futures. Rasio 1.5 artinya untuk setiap 1 akun short, ada 1.5 akun long.<\/p>\n      <p>Sering dipakai sebagai <b>contrarian indicator<\/b> — retail crowd sering salah di titik ekstrem.<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--green-dim);color:var(--green);\">Normal<\/span>\n      <span class=\"read-desc\">Rasio 0.8 - 1.3 — positioning retail seimbang, tidak ada sinyal ekstrem.<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Ekstrem<\/span>\n      <span class=\"read-desc\">Rasio di atas 2.0 (terlalu banyak long) atau di bawah 0.6 (terlalu banyak short) — crowd terlalu satu arah, rawan kena \"flush\" sebaliknya.<\/span>\n    <\/div>\n  <\/div>\n\n  <!-- LIQUIDATION HEATMAP SECTION -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-map-2\" style=\"color:var(--red);\"><\/i> Liquidation Heatmap<\/div>\n    <\/div>\n\n    <div class=\"explain\">\n      <div class=\"explain-title\"><i class=\"ti ti-info-circle\"><\/i> Apa Ini<\/div>\n      <p>Peta visual yang menunjukkan <b>di harga berapa saja<\/b> banyak posisi leverage akan ke-liquidate. Cluster besar di suatu level harga = \"target magnet\" yang sering ditarik oleh market (liquidity hunt).<\/p>\n      <p>Data ini tidak tersedia via API gratis untuk di-embed langsung — harus dicek manual di platform seperti Coinglass. Tapi ini <b>gratis untuk dilihat<\/b>, cuma tidak bisa auto-refresh di dashboard ini.<\/p>\n    <\/div>\n\n    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;\">Cara Baca<\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--red-dim);color:var(--red);\">Merah tebal<\/span>\n      <span class=\"read-desc\">Cluster liquidation besar di level tersebut — kalau harga menembus, kemungkinan ada cascade effect (harga bergerak cepat menuju level itu).<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--blue-dim);color:var(--blue);\">Di atas harga<\/span>\n      <span class=\"read-desc\">Cluster di atas harga sekarang = short liquidation zone. Kalau ditembus ke atas, short squeeze bisa terjadi (seperti Juli kemarin).<\/span>\n    <\/div>\n    <div class=\"read-row\">\n      <span class=\"read-tag\" style=\"background:var(--amber-dim);color:var(--amber);\">Di bawah harga<\/span>\n      <span class=\"read-desc\">Cluster di bawah harga sekarang = long liquidation zone. Kalau ditembus ke bawah, long squeeze / flush cepat bisa terjadi.<\/span>\n    <\/div>\n\n    <div class=\"link-card\">\n      <div class=\"link-left\">\n        <div class=\"link-icon\"><i class=\"ti ti-external-link\"><\/i><\/div>\n        <div>\n          <div class=\"link-title\">Coinglass Liquidation Heatmap<\/div>\n          <div class=\"link-desc\">Gratis, real-time, tidak perlu akun untuk versi basic<\/div>\n        <\/div>\n      <\/div>\n      <a href=\"https://www.coinglass.com/pro/futures/LiquidationHeatMap\" target=\"_blank\" class=\"link-btn\">Buka <i class=\"ti ti-arrow-up-right\"><\/i><\/a>\n    <\/div>\n  <\/div>\n\n  <!-- SUMMARY PLAYBOOK -->\n  <div class=\"section\">\n    <div class=\"sec-head\">\n      <div class=\"sec-title\"><i class=\"ti ti-checklist\"><\/i> Playbook Pagi — 3 Menit<\/div>\n    <\/div>\n    <div class=\"explain\" style=\"border-left-color:var(--green-border);\">\n      <p><b>1. Cek funding rate di sini<\/b> — kalau sangat negatif (< -0.05%), ada fuel buat short squeeze.<\/p>\n      <p><b>2. Bandingkan OI dengan price<\/b> — harga naik tapi OI turun = rally rapuh (short covering), bukan demand asli.<\/p>\n      <p><b>3. Buka Coinglass heatmap<\/b> — lihat cluster liquidation terdekat di atas & bawah harga sekarang. Itu magnet yang paling mungkin ditarik duluan.<\/p>\n    <\/div>\n  <\/div>\n\n  <!-- FOOTER -->\n  <div class=\"footer\">\n    <p>BTC Fuel Gauge · Data: Binance Futures Public API (BTCUSDT Perpetual) · Update tiap refresh<\/p>\n    <span>Bukan financial advice.<\/span>\n  <\/div>\n  <div class=\"disclaimer\">\n    Funding rate & OI ekstrem menunjukkan potensi \"bahan bakar\" untuk pergerakan cepat — bukan prediksi arah. Kombinasikan dengan struktur teknikal dan konteks makro sebelum ambil keputusan.\n  <\/div>\n\n<\/div>\n\n<\/div>\n<div id=\"tab-matrix\" class=\"tabpane\"><div class=\"w\">\n<div class=\"eb\">BTC/USD · Calendar Matrix<\/div>\n<h1>Time Matrix <em>Q1 — Q2<\/em> 2027<\/h1>\n<div class=\"sub\">9 layer waktu: Fib ratio &amp; Fib/Lucas count · Gann (1/8 tahun, anniversary, musiman) · Geometry (Square of 9, time = price) · Hurst cycle · Bradley siderograph · Astro · 500-day rule · analog siklus · FOMC &amp; opex<\/div>\n\n<div class=\"warn\"><b>Review Okt–Des 2026.<\/b> Cluster utama 14-16 Nov ternyata 5 hari lebih awal dari low 21 Nov ($55.1k, data Crypto.com), dan masih di dalam window analog siklus. Ada juga yang perlu dikoreksi: anchor A (2 Apr) dan B (10 Mei) basisnya sama-sama 38 hari dan jaraknya juga 38 hari. Jadi A×(n+1) selalu jatuh di tanggal yang sama dengan B×n, dan konfluensi \"dua anchor\" di 16 Nov dan 24 Des itu sebenernya cuma satu layer yang kehitung dua kali. Di matrix 2027 tiap layer dihitung sekali saja. Tetap pakai ini sebagai <b>kalender buat perhatiin price action<\/b>, bukan sinyal arah.<\/div>\n\n<div class=\"mt\"><em>Layer<\/em> waktu<\/div>\n<table>\n<tr><th>Layer<\/th><th>Isi<\/th><th>Catatan<\/th><\/tr>\n<tr><td>Fib<\/td><td>Ratio: low + 411 hari × 0.146/0.236/0.382/0.5. Count: hari ke-55, 89, 144 (Fibonacci) dan 47, 76, 123, 199 (Lucas) dari low<\/td><td>Anchor ATH 6 Okt 2025 → low 21 Nov 2026<\/td><\/tr>\n<tr><td>Gann<\/td><td>Kelipatan 45 hari (1/8 tahun) dari low dan dari ATH, anniversary 1 tahun pivot 2026 (2 Apr, 10 Mei, 27 Mei), tanggal musiman: cross-quarter 4 Feb dan 5 Mei, equinox 21 Mar, solstice 21 Jun<\/td><td>Musiman dihitung ephem<\/td><\/tr>\n<tr><td>Geometry<\/td><td>Square of 9: hari ke-n² dari low (49, 64, 81, 100, 121, 144, 169, 196). Time = price: low $55.1k → 55 hari, range ATH−low $71.1k → 71 hari<\/td><td>Skala $1.000 = 1 hari itu pilihan bebas, bobot kecil<\/td><\/tr>\n<tr><td>Hurst<\/td><td>Trough nominal dari low: 40 hari, 80 hari, 20 minggu (140 hari)<\/td><td>Siklus Hurst melar ±10-15%, jadi tanggalnya kira-kira<\/td><\/tr>\n<tr><td>Bradley<\/td><td>Titik balik siderograph (aspek planet Mercury–Pluto + deklinasi Venus/Mars), 6 turn terbesar di H1<\/td><td>Implementasi aproksimasi gw sendiri. Turn = waktu, bukan arah<\/td><\/tr>\n<tr><td>Astro<\/td><td>New/full moon, Mercury retro 11 Feb-5 Mar dan 12 Jun-6 Jul, Mars retro 12 Jan-3 Apr, Jupiter direct 14 Apr<\/td><td>ephem, WIB<\/td><\/tr>\n<tr><td>500-day<\/td><td>T-450, T-400, T-365, T-300 dari estimasi halving 11 Apr 2028<\/td><td>Sama dengan tab Simulator<\/td><\/tr>\n<tr><td>Analog<\/td><td>Hari ke-N dari low yang jadi titik balik di 2019 (low 15 Des 2018) dan 2023 (low 21 Nov 2022)<\/td><td>2 sampel<\/td><\/tr>\n<tr><td>Makro<\/td><td>Keputusan FOMC (WIB): 28 Jan, 18 Mar, 29 Apr, 10 Jun. Opex kuartalan 26 Mar dan 25 Jun<\/td><td>federalreserve.gov, Deribit<\/td><\/tr>\n<\/table>\n<div class=\"warn\" style=\"margin-top:1rem\"><b>Cara hitung skor.<\/b> Skor = jumlah layer berbeda yang kena dalam ±1 hari. Kalau beberapa metode jatuh di <b>angka hari yang sama dari low<\/b> (misal Fib 144, Sq9 144 = 12², analog +144), itu dihitung 1, karena sebenernya satu hitungan yang sama. <b>Baseline:<\/b> dengan 9 layer, 12 dari 181 hari di H1 (7%) udah punya skor ≥3, dan cuma 2 hari yang skornya ≥4. Jadi skor 3 itu biasa aja. Yang beda dari \"kebetulan\" cuma yang ≥4. <b>Koreksi dari versi sebelumnya:<\/b> cluster 12-16 Jun yang tadinya 4 layer turun jadi 2 setelah dedup (Fib 0.5 dan analog +206 itu sama-sama hari ke-206), plus Mercury retro 12 Jun jatuh 3 hari di luar toleransi.<\/div>\n<div class=\"mt\"><em>Heatmap<\/em> Jan — Jun<\/div>\n<div class=\"hs\"><div class=\"hr\"><span class=\"hm\">Jan<\/span><div class=\"hc\"><i style=\"background:var(--bg2)\" title=\"1 Jan: - | skor ±1 hari: 0\"><\/i><i style=\"background:var(--bg2)\" title=\"2 Jan: - | skor ±1 hari: 0\"><\/i><i style=\"background:var(--bg2)\" title=\"3 Jan: - | skor ±1 hari: 0\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"4 Jan: - | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"5 Jan: Gann 45d low | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"6 Jan: - | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"7 Jan: Lucas 47 | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.7)\" title=\"8 Jan: New Moon ♑ | skor ±1 hari: 3\">8<\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"9 Jan: Sq9 49 | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"10 Jan: - | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.18)\" title=\"11 Jan: - | skor ±1 hari: 1\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"12 Jan: Mars ℞ | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.38)\" title=\"13 Jan: Analog 2023 +53 | skor ±1 hari: 2\"><\/i><i style=\"background:rgba(184,134,11,.7)\" title=\"14 Jan: - | sko
