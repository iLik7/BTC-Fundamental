ro<\/span><\/span><\/td><\/tr><tr><td>28 Jun<\/td><td>Gann 630d ATH<\/td><td class=\"nt\">630 hari dari ATH 6 Okt 2025<\/td><td><span class=\"tg\"><span class=\"gn\">Gann<\/span><\/span><\/td><\/tr><\/table><\/details>\n\n<div class=\"ft\">Semua tanggal dihitung Python dari anchor ATH 6 Okt 2025 dan low 21 Nov 2026. Kalau low baru terbentuk, semua hitungan dari low (Fib, Gann, Square of 9, Hurst, analog) harus diulang. Astro, tanggal musiman, dan Bradley dihitung dengan library ephem (WIB, toleransi ±1 hari). Bradley di sini aproksimasi (bobot aspek ±10 dengan orb 15°, long-term ×4, ditambah deklinasi Venus dan Mars), jadi bisa beda sedikit dari siderograph yang dijual orang. FOMC dari federalreserve.gov, opex mengikuti aturan Deribit. Layer-layer ini tidak independen, banyak yang dihitung dari anchor yang sama, dan belum ada yang divalidasi statistik. Makin banyak layer, makin gampang tanggal \"numpuk\" secara kebetulan. Bukan financial advice.<\/div>\n\n<details style=\"margin-top:2rem\"><summary style=\"cursor:pointer;font-size:11px;color:var(--t2)\">Arsip: Time Matrix Okt–Des 2026<\/summary>\n\n<div class=\"sub\">Fib Time (3 anchor) · Moon &amp; planetary stations (ephemeris, ±1 hari WIB) · siklus 4 tahun · kalender makro<\/div>\n\n<div class=\"warn\"><b>Koreksi penting soal matrix Mei-Okt sebelumnya.<\/b> Tanggal moon phase dan beberapa transit planet di sana gw tulis dari estimasi, dan setelah dicek ke ephemeris banyak yang meleset. Jadi \"akurat\"-nya Full Moon 11 Juni, New Moon 24 Juni, dan Super Confluence 10 Juli itu <b>tidak valid<\/b>. Fib Time-nya (hitungan Python) tetap benar secara matematis, tapi hit-rate-nya jelek: 2 Juni bukan bottom dan 10 Juli meleset. Dengan sebanyak ini rasio, hampir selalu ada tanggal yang \"kena\". Pakai ini sebagai <b>kalender buat perhatiin price action<\/b>, bukan sinyal arah.\n<table><tr><th>Event<\/th><th>Di matrix lama<\/th><th>Ephemeris<\/th><\/tr>\n<tr><td>Mercury retro<\/td><td class=\"x\">1-25 Mei, 10 Sep-2 Okt<\/td><td class=\"o\">30 Jun-24 Jul dan 24 Okt-14 Nov<\/td><\/tr>\n<tr><td>Saturn retro<\/td><td class=\"x\">14 Jun-27 Okt<\/td><td class=\"o\">27 Jul-11 Des<\/td><\/tr>\n<tr><td>Jupiter retro<\/td><td class=\"x\">12 Agu<\/td><td class=\"o\">13 Des<\/td><\/tr>\n<tr><td>Jupiter masuk Leo<\/td><td>30 Jun<\/td><td class=\"o\">30 Jun (benar)<\/td><\/tr>\n<tr><td>New Moon<\/td><td class=\"x\">27 Mei, 24 Jun, 24 Jul, 21 Sep, 21 Okt<\/td><td class=\"o\">16 Mei, 15 Jun, 14 Jul, 12 Agu, 11 Sep, 10 Okt, 9 Nov<\/td><\/tr>\n<tr><td>Full Moon<\/td><td class=\"x\">13 Mei, 11 Jun, 10 Jul, 9 Agu, 7 Sep<\/td><td class=\"o\">31 Mei, 29 Jun, 29 Jul, 28 Agu, 26 Sep, 26 Okt<\/td><\/tr><\/table><\/div>\n\n<div class=\"mt\"><em>Oktober<\/em> — sisa bulan<\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--bl)\"><\/div><div class=\"d\"><b>18<\/b><span>Okt<\/span><\/div><div class=\"bd\"><div class=\"ti\">Fib Time B×4.236<\/div><div class=\"ds\">161 hari dari high 10 Mei. Satu layer saja, bobot kecil.<\/div><div class=\"tg\"><span class=\"f\">Fib B×4.236<\/span><\/div><\/div><div class=\"sc\"><i>★<\/i>1 layer<\/div><\/div>\n<div class=\"c s\"><div class=\"st\" style=\"background:var(--red)\"><\/div><div class=\"d\"><b>24<\/b><span>Okt<\/span><\/div><div class=\"bd\"><div class=\"ti\">Mercury Retrograde mulai (Scorpio)<\/div><div class=\"ds\">Berlangsung sampai 14 Nov. Folklore-nya: false breakout dan pergerakan \"aneh\". Gw nggak ada bukti statistik, jadi anggap sebagai pengingat buat tunggu konfirmasi candle.<\/div><div class=\"tg\"><span class=\"p\">Mercury ℞<\/span><\/div><\/div><div class=\"sc\"><i>★★<\/i>watch<\/div><\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--am)\"><\/div><div class=\"d\"><b>26-28<\/b><span>Okt<\/span><\/div><div class=\"bd\"><div class=\"ti\">Full Moon Taurus + FOMC<\/div><div class=\"ds\">Full Moon 26 Okt. FOMC akhir Oktober (seingat gw 27-28 Okt, cek kalender resmi Fed). Setelah hot CPI, ini katalis makro terbesar bulan ini.<\/div><div class=\"tg\"><span class=\"m\">Full Moon ♉<\/span><span class=\"k\">FOMC<\/span><\/div><\/div><div class=\"sc\"><i>★★<\/i>macro<\/div><\/div>\n\n<div class=\"mt\"><em>November<\/em> 2026<\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--bl)\"><\/div><div class=\"d\"><b>1<\/b><span>Nov<\/span><\/div><div class=\"bd\"><div class=\"ti\">Fib Time B×4.618<\/div><div class=\"ds\">Satu layer. Bertepatan dengan close bulanan Oktober (07:00 WIB), jadi perhatiin warna candle monthly-nya.<\/div><div class=\"tg\"><span class=\"f\">Fib B×4.618<\/span><span class=\"k\">Monthly close<\/span><\/div><\/div><div class=\"sc\"><i>★<\/i>1 layer<\/div><\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--am)\"><\/div><div class=\"d\"><b>3<\/b><span>Nov<\/span><\/div><div class=\"bd\"><div class=\"ti\">Midterm Election AS<\/div><div class=\"ds\">Katalis politik/regulasi (CLARITY Act sempat jadi overhang). Volatilitas sekitar tanggal ini wajar.<\/div><div class=\"tg\"><span class=\"k\">Makro<\/span><\/div><\/div><div class=\"sc\"><i>★<\/i>macro<\/div><\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--pu)\"><\/div><div class=\"d\"><b>9<\/b><span>Nov<\/span><\/div><div class=\"bd\"><div class=\"ti\">New Moon Scorpio<\/div><div class=\"ds\">Di tengah Mercury retro. Dalam folklore pasar, New Moon dianggap awal siklus, tapi buktinya lemah.<\/div><div class=\"tg\"><span class=\"m\">New Moon ♏<\/span><span class=\"p\">Mercury ℞ aktif<\/span><\/div><\/div><div class=\"sc\"><i>★<\/i>1-2 layer<\/div><\/div>\n<div class=\"c s\"><div class=\"st\" style=\"background:var(--gold)\"><\/div><div class=\"d\"><b>14-16<\/b><span>Nov<\/span><\/div><div class=\"bd\"><div class=\"ti\">Cluster utama Nov <span class=\"tg\"><span class=\"y\">3 layer<\/span><\/span><\/div><div class=\"ds\"><b>14 Nov:<\/b> Mercury direct. <b>16 Nov:<\/b> Fib A×6 dan B×5 jatuh di hari yang sama (dua anchor). Selain itu, analog siklus 2014/2018/2022 menaruh final low sekitar 363-406 hari setelah peak (ATH 6 Okt 2025), jadi window itu kira-kira <b>3 Okt - 16 Nov 2026<\/b>. Cluster ini bertepatan dengan ujung window tersebut. Sampelnya cuma 3 siklus, dan era ETF bisa mengubah pola.<\/div><div class=\"tg\"><span class=\"p\">Mercury direct<\/span><span class=\"f\">Fib A×6<\/span><span class=\"f\">Fib B×5<\/span><span class=\"k\">Analog siklus<\/span><\/div><\/div><div class=\"sc\"><i>★★★<\/i>3 layer<\/div><\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--am)\"><\/div><div class=\"d\"><b>24<\/b><span>Nov<\/span><\/div><div class=\"bd\"><div class=\"ti\">Full Moon Gemini<\/div><div class=\"ds\">Satu layer, bobot kecil.<\/div><div class=\"tg\"><span class=\"m\">Full Moon ♊<\/span><\/div><\/div><div class=\"sc\"><i>★<\/i>1 layer<\/div><\/div>\n\n<div class=\"mt\"><em>Desember<\/em> 2026<\/div>\n<div class=\"c s\"><div class=\"st\" style=\"background:var(--bl)\"><\/div><div class=\"d\"><b>8-9<\/b><span>Des<\/span><\/div><div class=\"bd\"><div class=\"ti\">FOMC + New Moon Sagittarius<\/div><div class=\"ds\">FOMC terakhir tahun ini (seingat gw 8-9 Des, cek kalender Fed). Dot plot kemungkinan menentukan apakah hike Desember terjadi.<\/div><div class=\"tg\"><span class=\"k\">FOMC<\/span><span class=\"m\">New Moon ♐<\/span><\/div><\/div><div class=\"sc\"><i>★★<\/i>macro<\/div><\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--pu)\"><\/div><div class=\"d\"><b>11-13<\/b><span>Des<\/span><\/div><div class=\"bd\"><div class=\"ti\">Saturn direct (11) dan Jupiter retrograde (13)<\/div><div class=\"ds\">Dua transit planet besar berdekatan. Kebalikan dari klaim lama gw: Saturn retro berlangsung Jul-Des, bukan Jun-Okt.<\/div><div class=\"tg\"><span class=\"g\">Saturn direct<\/span><span class=\"p\">Jupiter ℞<\/span><\/div><\/div><div class=\"sc\"><i>★★<\/i>2 layer<\/div><\/div>\n<div class=\"c\"><div class=\"st\" style=\"background:var(--bl)\"><\/div><div class=\"d\"><b>18<\/b><span>Des<\/span><\/div><div class=\"bd\"><div class=\"ti\">Fib A×6.854<\/div><div class=\"ds\">Rasio ekstensi Fibonacci besar. Satu layer.<\/div><div class=\"tg\"><span class=\"f\">Fib A×6.854<\/span><\/div><\/div><div class=\"sc\"><i>★<\/i>1 layer<\/div><\/div>\n<div class=\"c s\"><div class=\"st\" style=\"background:var(--gold)\"><\/div><div class=\"d\"><b>24-25<\/b><span>Des<\/span><\/div><div class=\"bd\"><div class=\"ti\">Cluster akhir tahun <span class=\"tg\"><span class=\"y\">3 layer<\/span><\/span><\/div><div class=\"ds\">24 Des: Fib A×7 dan B×6 (dua anchor) plus Full Moon Cancer. 25 Des: options expiry kuartalan (seingat gw Deribit tiap Jumat terakhir bulan kuartal, cek ulang). Likuiditas liburan tipis, jadi gerakan bisa ekstrem.<\/div><div class=\"tg\"><span class=\"f\">Fib A×7<\/span><span class=\"f\">Fib B×6<\/span><span class=\"m\">Full Moon ♋<\/span><span class=\"k\">Options expiry<\/span><\/div><\/div><div class=\"sc\"><i>★★★<\/i>3 layer<\/div><\/div>\n\n<div class=\"ft\">Fib Time dihitung dengan Python dari 3 anchor: A = low 2 Apr 2026 (basis 38 hari), B = high 10 Mei 2026 (basis 38 hari), C = low 27 Mei 2026 (basis 17 hari). Moon phase, retrograde, dan station dihitung dengan library ephem (UTC, geser +7 jam untuk WIB). Jadwal FOMC dan opex dari ingatan gw, wajib dicek ulang ke sumber resmi. Layer-layer di sini tidak independen dan belum divalidasi secara statistik. Bukan financial advice.<\/div>\n<\/details>\n<\/div><\/div>\n<script>\nconst fmt = n => '$' + Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });\nconst fmtNum = n => Number(n).toLocaleString('en-US', { maximumFractionDigits: 0 });\n\nasync function jget(url,opt){\n  const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);\n  try{const r=await fetch(url,Object.assign({signal:c.signal},opt||{}));\n    if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}\n  finally{clearTimeout(t);}\n}\nconst PROV={\n  okx:async()=>{\n    const B='https://www.okx.com/api/v5/';const id='BTC-USDT-SWAP';\n    const [f,m,o,l]=await Promise.allSettled([\n      jget(B+'public/funding-rate?instId='+id),\n      jget(B+'public/mark-price?instType=SWAP&instId='+id),\n      jget(B+'public/open-interest?instType=SWAP&instId='+id),\n      jget(B+'rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=1H')]);\n    const r={};\n    if(f.status==='fulfilled')r.funding=parseFloat(f.value.data[0].fundingRate)*100;\n    if(m.status==='fulfilled')r.price=parseFloat(m.value.data[0].markPx);\n    if(o.status==='fulfilled')r.oi=parseFloat(o.value.data[0].oiCcy);\n    if(l.status==='fulfilled')r.ls=parseFloat(l.value.data[0][1]);\n    if(!Object.keys(r).length)throw new Error('semua endpoint gagal');\n    return r;},\n  bybit:async()=>{\n    const B='https://api.bybit.com/v5/market/';\n    const [t,l]=await Promise.allSettled([\n      jget(B+'tickers?category=linear&symbol=BTCUSDT'),\n      jget(B+'account-ratio?category=linear&symbol=BTCUSDT&period=1h&limit=1')]);\n    const r={};\n    if(t.status==='fulfilled'){const x=t.value.result.list[0];r.price=+x.markPrice;r.funding=+x.fundingRate*100;r.oi=+x.openInterest;}\n    if(l.status==='fulfilled'){const x=l.value.result.list[0];r.ls=+x.buyRatio/+x.sellRatio;}\n    if(!Object.keys(r).length)throw new Error('semua endpoint gagal');\n    return r;},\n  hyperliquid:async()=>{\n    const d=await jget('https://api.hyperliquid.xyz/info',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'metaAndAssetCtxs'})});\n    const i=d[0].universe.findIndex(u=>u.name==='BTC');const c=d[1][i];\n    return{price:+c.markPx,funding:+c.funding*8*100,oi:+c.openInterest};}, // HL funding per jam, dikali 8 = setara 8 jam\n  binance:async()=>{\n    const B='https://fapi.binance.com/';\n    const [p,o,l]=await Promise.allSettled([\n      jget(B+'fapi/v1/premiumIndex?symbol=BTCUSDT'),\n      jget(B+'fapi/v1/openInterest?symbol=BTCUSDT'),\n      jget(B+'futures/data/globalLongShortAccountRatio?symbol=BTCUSDT&period=1h&limit=1')]);\n    const r={};\n    if(p.status==='fulfilled'){r.price=+p.value.markPrice;r.funding=+p.value.lastFundingRate*100;}\n    if(o.status==='fulfilled')r.oi=+o.value.openInterest;\n    if(l.status==='fulfilled')r.ls=+l.value[0].longShortRatio;\n    if(!Object.keys(r).length)throw new Error('semua endpoint gagal');\n    return r;}\n};\nasync function doRefresh(){\n  const ic=document.getElementById('ric'),btn=document.getElementById('rbtn');\n  ic.classList.add('spin');btn.disabled=true;\n  document.getElementById('mc-time').textContent='memuat...';\n  const order=['okx','bybit','hyperliquid','binance'];\n  const res=await Promise.allSettled(order.map(k=>PROV[k]()));\n  const data={},src={},log=[];\n  res.forEach((r,i)=>{\n    if(r.status==='fulfilled'){\n      for(const k of ['price','funding','oi','ls']){\n        if(data[k]===undefined&&r.value[k]!==undefined&&!isNaN(r.value[k])){data[k]=r.value[k];src[k]=order[i];}}\n      log.push(order[i]+': OK');\n    }else log.push(order[i]+': GAGAL ('+(r.reason&&r.reason.message||r.reason)+')');\n  });\n  let dbg=document.getElementById('dbg');\n  if(!dbg){dbg=document.createElement('div');dbg.id='dbg';dbg.style.cssText='font-size:10px;color:#a8a29c;margin:-10px 0 18px;line-height:1.7;letter-spacing:.03em';\n    document.querySelector('#tab-fuel .metrics').after(dbg);}\n  dbg.textContent='Status sumber → '+log.join(' · ');\n  if(data.price!==undefined){document.getElementById('mc-price').textContent=fmt(data.price);document.getElementById('mc-time').textContent=(src.price||'').toUpperCase()+' · '+new Date().toLocaleTimeString('id-ID');}\n  else{document.getElementById('mc-price').textContent='Error';document.getElementById('mc-time').textContent='semua sumber gagal';}\n  if(data.oi!==undefined)document.getElementById('mc-oi').textContent=fmtNum(data.oi)+' BTC';\n  if(data.funding!==undefined){\n    const fr=data.funding,el=document.getElementById('mc-funding'),bar=document.getElementById('bar-funding'),g=document.getElementById('funding-gauge');\n    el.textContent=(fr>=0?'+':'')+fr.toFixed(4)+'%';\n    const set=(c,d,t)=>{el.style.color=c;bar.style.background=c;g.textContent=t;g.style.background=d;g.style.color=c;};\n    if(fr<=-0.05)set('var(--amber)','var(--amber-dim)','⚠️ Waspada — Short Crowded');\n    else if(fr>=0.05)set('var(--red)','var(--red-dim)','🔥 Overheat — Long Crowded');\n    else set('var(--green)','var(--green-dim)','✓ Netral');\n  }\n  if(data.ls!==undefined){\n    const r=data.ls;document.getElementById('mc-ls').textContent=r.toFixed(2);\n    const b=document.getElementById('bar-ls'),sb=document.getElementById('mc-ls-sub');\n    if(r>=2||r<=0.6){b.style.background='var(--amber)';sb.textContent='Ekstrem — '+(r>=2?'long':'short')+' dominan';sb.style.color='var(--amber)';}\n    else{b.style.background='var(--green)';sb.textContent='Normal — seimbang';sb.style.color='var(--text3)';}\n  }\n  ic.classList.remove('spin');btn.disabled=false;\n  document.getElementById('ts').textContent=new Date().toLocaleTimeString('id-ID');\n}\nasync function fng(){\n  try{\n    const d=(await jget('https://api.alternative.me/fng/?limit=2')).data;\n    const v=parseInt(d[0].value), y=parseInt(d[1].value);\n    document.getElementById('mc-fng').textContent=v;\n    const sub=document.getElementById('mc-fng-sub');\n    sub.textContent=d[0].value_classification+' (kemarin '+y+')';\n    const b=document.getElementById('bar-fng');\n    b.style.background= v<25?'var(--red)':v<50?'var(--amber)':v<75?'var(--green)':'var(--blue)';\n  }catch(e){document.getElementById('mc-fng').textContent='Error';document.getElementById('mc-fng-sub').textContent=e.message;}\n}\ndoRefresh();\nfng();\n\ndocument.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{\n  document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('on'));\n  document.querySelectorAll('.tabpane').forEach(x=>x.classList.remove('on'));\n  b.classList.add('on');document.getElementById(b.dataset.t).classList.add('on');\n  window.scrollTo(0,0);\n}));\n<\/script><style>.tabs{display:none!important}<\/style><script>addEventListener('DOMContentLoaded',function(){var b=document.querySelector('.tabbtn[data-t=\"tab-matrix\"]');if(b)b.click();});<\/script><\/body><\/html>", "sim": "<!DOCTYPE html>\n<html lang=\"id\"><head><meta charset=\"UTF-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>BTC 500-Day Rule Simulator<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400;500&display=swap\" rel=\"stylesheet\">\n<script src=\"https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js\"><\/script>\n<style>\n*{box-sizing:border-box;margin:0;padding:0}\n:root{--bg:#fafaf8;--bg2:#f5f4f0;--b:#e0ddd8;--b2:#d0ccc5;--t:#1a1714;--t2:#6b6560;--t3:#a8a29c;--gold:#b8860b;--gd:rgba(184,134,11,.08);--gb:rgba(184,134,11,.25);--red:#8b2020;--rd:rgba(139,32,32,.08);--gr:#1a6b47;--grd:rgba(26,107,71,.08);--am:#7a5000;--bl:#1a3a6b;--sh:0 1px 4px rgba(0,0,0,.06),0 4px 20px rgba(0,0,0,.04)}\nbody{background:var(--bg);color:var(--t);font-family:'DM Mono',monospace;min-height:100vh}\nbody::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 0%,rgba(184,134,11,.04),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(184,134,11,.03),transparent 50%);pointer-events:none}\n.w{max-width:1000px;margin:0 auto;padding:2.3rem 1.5rem 4rem;position:relative}\n.eb{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}\nh1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;line-height:1.12}\nh1 em{font-style:italic;color:var(--gold)}\n.sub{font-size:10px;color:var(--t3);margin:8px 0 1.5rem;line-height:1.8}\n.sec{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin:1.8rem 0 10px;display:flex;align-items:center;gap:10px}\n.sec::after{content:'';flex:1;height:1px;background:var(--b)}\n.panel{background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:1.2rem 1.4rem;box-shadow:var(--sh)}\n.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 22px}\n.f label{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;color:var(--t2);margin-bottom:6px}\n.f label b{color:var(--t);font-weight:500}\ninput[type=range]{width:100%;accent-color:var(--gold)}\ninput[type=number],input[type=date]{width:100%;font-family:inherit;font-size:12px;padding:7px 9px;border:1px solid var(--b2);background:var(--bg);color:var(--t);border-radius:2px}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.btn{font-family:inherit;font-size:11px;padding:6px 12px;border:1px solid var(--b2);background:transparent;color:var(--t2);border-radius:2px;cursor:pointer}\n.btn:hover{border-color:var(--gold);color:var(--gold)}.btn.on{background:var(--t);color:var(--bg);border-color:var(--t)}\n#msg{font-size:10px;color:var(--t3);margin-top:8px;min-height:14px}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--b);border:1px solid var(--b);border-radius:4px;overflow:hidden;box-shadow:var(--sh)}\n.c{background:var(--bg);padding:15px 16px;position:relative}\n.c .l{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}\n.c .v{font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1}\n.c .s{font-size:10px;color:var(--t3);margin-top:6px}\n.c::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--bar,var(--b))}\n.pos{color:var(--gr)}.neg{color:var(--red)}.gd{color:var(--gold)}\n.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}\n@media(max-width:760px){.two{grid-template-columns:1fr}}\ntable{width:100%;border-collapse:collapse;font-size:11px}\nth,td{padding:8px 8px;border-bottom:1px solid var(--b);text-align:left}\nth{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);font-weight:400}\ntd.m{text-align:center}\n.tl{display:flex;flex-direction:column;gap:0}\n.tr{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--b);font-size:11px}\n.tr:last-child{border-bottom:none}\n.tr b{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:500;min-width:105px}\n.tr span{color:var(--t2);line-height:1.6}\n.note{font-size:11px;color:var(--t2);line-height:1.9;background:var(--bg2);border-left:2px solid var(--gb);padding:12px 16px;margin-top:1.4rem}\n.note b{color:var(--t)}\n.ft{margin-top:1.4rem;font-size:10px;color:var(--t3);font-style:italic;line-height:1.8}\ncanvas{max-width:100%}\n.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--t2);margin-top:8px}\n.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}\n<\/style><\/head><body><div class=\"w\">\n<div class=\"eb\">BTC · Halving 500-Day Rule<\/div>\n<h1>Simulator <em>expected gain<\/em><\/h1>\n<div class=\"sub\">Beli T-500 · jual T+500 · jendela ±1000 hari · Monte Carlo 20.000 skenario berbasis peluruhan rasio exit ÷ ATH siklus lalu · jalan offline, tanpa API<\/div>\n\n<div class=\"sec\">Asumsi (geser, hasil update langsung)<\/div>\n<div class=\"panel\">\n <div class=\"grid\">\n  <div class=\"f\"><label>Harga entry di T-500 <b id=\"entryv\"><\/b><\/label><input type=\"range\" id=\"entry\" min=\"35000\" max=\"100000\" step=\"500\" value=\"76000\"><\/div>\n  <div class=\"f\"><label>ATH acuan <b id=\"athv\"><\/b><\/label><input type=\"number\" id=\"ath\" value=\"126000\" step=\"1000\"><\/div>\n  <div class=\"f\"><label>Rasio exit ÷ ATH (median) <b id=\"ratiov\"><\/b><\/label><input type=\"range\" id=\"ratio\" min=\"0.6\" max=\"2.5\" step=\"0.05\" value=\"1.3\"><\/div>\n  <div class=\"f\"><label>Ketidakpastian (σ log) <b id=\"sdv\"><\/b><\/label><input type=\"range\" id=\"sd\" min=\"0.15\" max=\"0.8\" step=\"0.05\" value=\"0.45\"><\/div>\n  <div class=\"f\"><label>Estimasi halving 2028<\/label><input type=\"date\" id=\"est\" value=\"2028-04-11\"><\/div>\n  <div class=\"f\"><label>Mcap emas (T$, kasar)<\/label><input type=\"number\" id=\"gold\" value=\"29\" step=\"1\"><\/div>\n <\/div>\n <div class=\"row\">\n  <button class=\"btn\" data-r=\"1.0\">Pesimis ×1,0<\/button><button class=\"btn on\" data-r=\"1.3\">Base ×1,3<\/button><button class=\"btn\" data-r=\"1.7\">Optimis ×1,7<\/button>\n  <span style=\"width:10px\"><\/span>\n  <button class=\"btn\" data-e=\"45000\">Entry $45k<\/button><button class=\"btn\" data-e=\"58000\">$58k<\/button><button class=\"btn\" data-e=\"65000\">$65k<\/button><button class=\"btn\" data-e=\"76000\">$76k<\/button>\n  <button class=\"btn\" id=\"live\">Pakai harga live<\/button>\n <\/div>\n <div id=\"msg\"><\/div>\n<\/div>\n\n<div class=\"sec\">Hasil simulasi<\/div>\n<div class=\"cards\">\n <div class=\"c\" style=\"--bar:var(--gold)\"><div class=\"l\">Exit median<\/div><div class=\"v gd\" id=\"r-exit\">—<\/div><div class=\"s\" id=\"r-exit-s\"><\/div><\/div>\n <div class=\"c\" style=\"--bar:var(--gr)\"><div class=\"l\">Gain median<\/div><div class=\"v\" id=\"r-gain\">—<\/div><div class=\"s\" id=\"r-mult\"><\/div><\/div>\n <div class=\"c\" style=\"--bar:var(--bl)\"><div class=\"l\">Per tahun (median)<\/div><div class=\"v\" id=\"r-cagr\">—<\/div><div class=\"s\">1000 hari = 2,74 tahun<\/div><\/div>\n <div class=\"c\" style=\"--bar:var(--red)\"><div class=\"l\">Peluang rugi<\/div><div class=\"v\" id=\"r-loss\">—<\/div><div class=\"s\">exit &lt; entry (model)<\/div><\/div>\n <div class=\"c\" style=\"--bar:var(--gr)\"><div class=\"l\">Peluang ≥ 2×<\/div><div class=\"v\" id=\"r-2x\">—<\/div><div class=\"s\" id=\"r-p\">—<\/div><\/div>\n <div class=\"c\" style=\"--bar:var(--am)\"><div class=\"l\">Mcap saat exit<\/div><div class=\"v\" id=\"r-mc\">—<\/div><div class=\"s\" id=\"r-gold\">—<\/div><\/div>\n<\/div>\n\n<div class=\"sec\">Sebaran harga exit di T+500<\/div>\n<div class=\"two\">\n <div class=\"panel\"><canvas id=\"hist\" height=\"230\"><\/canvas>\n  <div class=\"leg\"><span><i style=\"background:rgba(139,32,32,.6)\"><\/i>rugi (&lt; entry)<\/span><span><i style=\"background:rgba(184,134,11,.6)\"><\/i>1× - 2×<\/span><span><i style=\"background:rgba(26,107,71,.6)\"><\/i>≥ 2×<\/span><\/div><\/div>\n <div class=\"panel\"><table><thead><tr><th>Persentil<\/th><th>Exit<\/th><th>Gain<\/th><\/tr><\/thead><tbody id=\"pt\"><\/tbody><\/table><\/div>\n<\/div>\n\n<div class=\"sec\">Matriks gain: harga entry × harga exit<\/div>\n<div class=\"panel\" style=\"overflow-x:auto\"><table id=\"mx\"><\/table><\/div>\n\n<div class=\"sec\">Kenapa gain makin kecil (data siklus lalu)<\/div>\n<div class=\"two\">\n <div class=\"panel\" style=\"overflow-x:auto\"><table><thead><tr><th>Halving<\/th><th>Buy T-500<\/th><th>Sell T+500<\/th><th>Entry<\/th><th>Entry ÷ ATH lalu<\/th><th>Return<\/th><\/tr><\/thead><tbody>\n  <tr><td>2012<\/td><td>17 Jul 2011<\/td><td>12 Apr 2014<\/td><td>$13,5<\/td><td class=\"m\">0,44<\/td><td class=\"pos\">+2890%<\/td><\/tr>\n  <tr><td>2016<\/td><td>25 Feb 2015<\/td><td>21 Nov 2017<\/td><td>$235<\/td><td class=\"m\">0,20<\/td><td class=\"pos\">+3318%<\/td><\/tr>\n  <tr><td>2020<\/td><td>28 Des 2018<\/td><td>23 Sep 2021<\/td><td>$3,8k<\/td><td class=\"m\">0,19<\/td><td class=\"pos\">+1067%<\/td><\/tr>\n  <tr><td>2024<\/td><td>7 Des 2022<\/td><td>2 Sep 2025<\/td><td>$17k<\/td><td class=\"m\">0,25<\/td><td class=\"pos\">+560%<\/td><\/tr>\n  <tr><td><b>2028<\/b><\/td><td id=\"h-buy\">—<\/td><td id=\"h-sell\">—<\/td><td id=\"h-e\">—<\/td><td class=\"m\" id=\"h-r\">—<\/td><td class=\"gd\" id=\"h-g\">—<\/td><\/tr><\/tbody><\/table>\n  <div style=\"font-size:10px;color:var(--t3);margin-top:8px;line-height:1.7\">Return dari Bitstamp close (Bitbo/BTC500). Entry dan ATH lalu dari tabel Pantera/CoinDesk, pembulatan. Inflasi pasca-halving: 12,5% → 4,2% → 1,8% → 0,83% → 0,40% (2028).<\/div><\/div>\n <div class=\"panel\"><canvas id=\"cg\" height=\"230\"><\/canvas><\/div>\n<\/div>\n\n<div class=\"sec\">Timeline window<\/div>\n<div class=\"panel\"><div class=\"tl\">\n <div class=\"tr\"><b id=\"d-buy\">—<\/b><span>T-500 · tanggal beli versi rule (tanggal ukur, bukan klaim bottom)<\/span><\/div>\n <div class=\"tr\"><b id=\"d-h\">—<\/b><span>Halving 2028 (estimasi, geser tergantung hashrate)<\/span><\/div>\n <div class=\"tr\"><b id=\"d-top\">—<\/b><span>Window top siklus: hari +525 s/d +546 setelah halving (rata-rata 3 siklus lalu)<\/span><\/div>\n <div class=\"tr\"><b id=\"d-sell\">—<\/b><span>T+500 · tanggal jual versi rule (historis nangkep 37-91% dari top)<\/span><\/div>\n<\/div><\/div>\n\n<div class=\"note\"><b>Cara baca:<\/b> median exit = ATH acuan × rasio. Rasio exit ÷ ATH lalu (13,9 → 7,0 → 2,3 → 1,67) terus turun, jadi default gw lanjutkan ke ×1,3. Geser slider buat lihat sensitivitas. Kalau lu percaya siklus kembali kuat, naikin rasionya. Kalau percaya efek ETF meredam terus, turunin.<\/div>\n<div class=\"ft\">Sampel cuma 4 siklus, jadi sebaran hasil sangat bergantung asumsi (rasio dan σ), bukan bukti statistik. Peluang rugi di model kecil karena model mengasumsikan siklus tetap \"rhyme\". Risiko struktural (kebijakan Fed, arus ETF, break pola) nggak termasuk. Gain bruto dalam USD, sebelum fee, pajak, dan kurs. Supply: ~20,1 juta (entry), ~20,5 juta (exit). Bukan financial advice.<\/div>\n<\/div>\n<script>\n/*PURE_START*/\nfunction mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction randn(r){let u=0,v=0;while(!u)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}\nfunction simulate(ath,ratio,sd,n,seed){const r=mulberry32(seed),a=new Float64Array(n),mu=Math.log(ratio);for(let i=0;i<n;i++)a[i]=ath*Math.exp(mu+sd*randn(r));a.sort();return a}\nfunction pct(a,p){return a[Math.min(a.length-1,Math.floor(p/100*a.length))]}\nfunction frac(a,fn){let c=0;for(let i=0;i<a.length;i++)if(fn(a[i]))c++;return c/a.length}\nconst DAY=86400000;\nfunction dayNum(s){return Math.floor(Date.parse(s+'T00:00:00Z')/DAY)}\nfunction dstr(d){return new Date(d*DAY).toISOString().slice(0,10)}\n/*PURE_END*/\nconst $=id=>document.getElementById(id);\nconst YRS=1000/365.25,S_EXIT=20.5e6;\nconst k=n=>'$'+(n/1000).toFixed(n>=100000?0:1)+'k';\nconst pc=n=>(n>=0?'+':'')+Math.round(n*100)+'%';\nlet hist,cg;\nconst HIST_CAGR=[['2012',30.9],['2016',34.18],['2020',11.67],['2024',6.6]].map(([l,m])=>[l,Math.pow(m,1/YRS)-1]);\nfunction run(){\n  const entry=+$('entry').value,ath=+$('ath').value||126000,ratio=+$('ratio').value,sd=+$('sd').value,gold=(+$('gold').value||29)*1e12;\n  $('entryv').textContent='$'+entry.toLocaleString('en-US');$('athv').textContent='$'+ath.toLocaleString('en-US');\n  $('ratiov').textContent='×'+ratio.toFixed(2);$('sdv').textContent=sd.toFixed(2);\n  const a=simulate(ath,ratio,sd,20000,42);\n  const med=pct(a,50),mult=med/entry,cagr=Math.pow(mult,1/YRS)-1;\n  $('r-exit').textContent=k(med);$('r-exit-s').textContent='p10 '+k(pct(a,10))+' · p90 '+k(pct(a,90));\n  const g=$('r-gain');g.textContent=pc(mult-1);g.className='v '+(mult>=1?'pos':'neg');$('r-mult').textContent='×'+mult.toFixed(2);\n  const cg_=$('r-cagr');cg_.textContent=pc(cagr);cg_.className='v '+(cagr>=0?'pos':'neg');\n  $('r-loss').textContent=Math.round(frac(a,x=>x<entry)*100)+'%';\n  $('r-2x').textContent=Math.round(frac(a,x=>x>=2*entry)*100)+'%';\n  $('r-p').textContent='≥ 1,5×: '+Math.round(frac(a,x=>x>=1.5*entry)*100)+'%';\n  const mc=med*S_EXIT;$('r-mc').textContent='$'+(mc/1e12).toFixed(1)+'T';$('r-gold').textContent=Math.round(mc/gold*100)+'% dari emas';\n  // histogram\n  const W=10000,N=39,cnt=new Array(N+1).fill(0);\n  a.forEach(x=>{cnt[Math.min(N,Math.floor(Math.max(0,x-20000)/W))]++});\n  const labels=cnt.map((_,i)=>i===N?'>'+k(20000+N*W):k(20000+i*W));\n  const cols=cnt.map((_,i)=>{const c=20000+i*W+W/2;return c<entry?'rgba(139,32,32,.6)':c<2*entry?'rgba(184,134,11,.6)':'rgba(26,107,71,.6)'});\n  if(!hist){hist=new Chart($('hist'),{type:'bar',data:{labels,datasets:[{data:cnt.map(c=>c/a.length*100),backgroundColor:cols,borderWidth:0,barPercentage:1,categoryPercentage:.95}]},options:{animation:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:i=>'Exit '+i[0].label,label:c=>c.parsed.y.toFixed(1)+'% skenario'}}},scales:{x:{ticks:{font:{family:'DM Mono',size:9},color:'#a8a29c',maxRotation:0,autoSkipPadding:12},grid:{display:false}},y:{ticks:{font:{family:'DM Mono',size:9},color:'#a8a29c',callback:v=>v+'%'},grid:{color:'rgba(224,221,216,.5)'}}}}});}\n  else{hist.data.labels=labels;hist.data.datasets[0].data=cnt.map(c=>c/a.length*100);hist.data.datasets[0].backgroundColor=cols;hist.update('none');}\n  // percentile table\n  $('pt').innerHTML=[10,25,50,75,90].map(p=>{const x=pct(a,p),m=x/entry-1;return '<tr><td>p'+p+'<\/td><td>'+k(x)+'<\/td><td class=\"'+(m>=0?'pos':'neg')+'\">'+pc(m)+'<\/td><\/tr>'}).join('')+'<tr><td>Rata-rata<\/td><td>'+k(a.reduce((s,x)=>s+x,0)/a.length)+'<\/td><td class=\"'+((a.reduce((s,x)=>s+x,0)/a.length)>=entry?'pos':'neg')+'\">'+pc(a.reduce((s,x)=>s+x,0)/a.length/entry-1)+'<\/td><\/tr>';\n  // matrix\n  const ex=[100e3,126e3,162e3,220e3,290e3],en=[45e3,50e3,58e3,65e3,76e3,80e3];\n  let h='<thead><tr><th>Entry \\\\ Exit<\/th>'+ex.map(e=>'<th class=\"m\">'+k(e)+'<\/th>').join('')+'<\/tr><\/thead><tbody>';\n  en.forEach(p=>{h+='<tr><td>'+k(p)+(p===entry?' ◂':'')+'<\/td>'+ex.map(e=>{const m=e/p-1,al=Math.min(.55,Math.max(.05,m/6));return '<td class=\"m\" style=\"background:rgba(26,107,71,'+al.toFixed(2)+')\">'+pc(m)+'<\/td>'}).join('')+'<\/tr>'});\n  $('mx').innerHTML=h+'<\/tbody>';\n  // history row + cagr chart\n  const est=dayNum($('est').value);\n  $('h-buy').textContent=dstr(est-500);$('h-sell').textContent=dstr(est+500);$('h-e').textContent=k(entry);\n  $('h-r').textContent=(entry/ath).toFixed(2);$('h-g').textContent=pc(mult-1)+' (sim)';\n  const lab=HIST_CAGR.map(x=>x[0]).concat('2028 sim'),dat=HIST_CAGR.map(x=>x[1]*100).concat(cagr*100);\n  const bc=['#8b2020','#1a6b47','#1a3a6b','#7a5000','#b8860b'];\n  if(!cg){cg=new Chart($('cg'),{type:'bar',data:{labels:lab,datasets:[{data:dat,backgroundColor:bc,borderWidth:0}]},options:{animation:false,plugins:{legend:{display:false},title:{display:true,text:'Return per tahun (CAGR) per siklus',font:{family:'DM Mono',size:10},color:'#6b6560'},tooltip:{callbacks:{label:c=>c.parsed.y.toFixed(0)+'% / tahun'}}},scales:{x:{ticks:{font:{family:'DM Mono',size:10},color:'#a8a29c'},grid:{display:false}},y:{ticks:{font:{family:'DM Mono',size:9},color:'#a8a29c',callback:v=>v+'%'},grid:{color:'rgba(224,221,216,.5)'}}}}});}\n  else{cg.data.datasets[0].data=dat;cg.update('none');}\n  // timeline\n  $('d-buy').textContent=dstr(est-500);$('d-h').textContent=dstr(est);$('d-top').textContent=dstr(est+525).slice(0,7)+' (±)';$('d-sell').textContent=dstr(est+500);\n}\ndocument.querySelectorAll('input').forEach(i=>i.addEventListener('input',run));\ndocument.querySelectorAll('.btn[data-r]').forEach(b=>b.addEventListener('click',()=>{$('ratio').value=b.dataset.r;document.querySelectorAll('.btn[data-r]').forEach(x=>x.classList.remove('on'));b.classList.add('on');run()}));\ndocument.querySelectorAll('.btn[data-e]').forEach(b=>b.addEventListener('click',()=>{$('entry').value=b.dataset.e;run()}));\n$('live').addEventListener('click',async()=>{$('msg').textContent='Mengambil harga…';\n  try{const c=new AbortController();setTimeout(()=>c.abort(),8000);const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd',{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);\n    const p=(await r.json()).bitcoin.usd;$('entry').value=Math.min(100000,Math.max(35000,Math.round(p/500)*500));$('msg').textContent='Harga live: $'+Math.round(p).toLocaleString('en-US');run();}\n  catch(e){$('msg').textContent='Gagal ambil harga ('+e.message+'). Isi manual pakai slider. Kalau buka di preview Claude, download dan buka di Chrome.';}});\nrun();\n<\/script><\/body><\/html>\n", "spx": "<!DOCTYPE html>\n<html lang=\ FOLIO — S1<\/div>\n<div class=\"proj-grid\" id=\"proj-grid\"><\/div>\n<div class=\"divider\"><\/div>\n<div class=\"sec-lbl\">TARGET PRICE KALAU SPX CAPAI:<\/div>\n<div class=\"proj-grid\" id=\"target-grid\"><\/div>\n\n<script>\n// ── CONSTANTS ─────────────────────────────────────────\nconst HOLDINGS = 1080.93;\nconst AVG_IDR  = 16937.08;\nconst MODAL    = AVG_IDR * HOLDINGS;\nconst IDR_FALLBACK = 16350;\n\nlet liveUSD = null, liveIDR = null, live24h = null;\nlet idrRateCache = null;\nlet prevUSD = null;\nlet countdown = 60, timer = null, currentS = 1;\nlet mainChartInst = null, btcChartInst = null, spxAnonChartInst = null;\nlet tapeChartInst = null;\n\n// ══════════════════════════════════════════════════════\n// 🎯 DYNAMIC TIMELINE — auto-detect \"NOW\" dari tanggal\n// ══════════════════════════════════════════════════════\nconst Q_LABELS = ['Jan','Apr','Jul','Okt'];\nconst START_YEAR = 2023, START_Q = 3;   // Okt 2023\n\nfunction buildTimeline(){\n  const today = new Date();\n  const nowQ = Math.floor(today.getMonth()/3);   // 0=Jan-Mar, 1=Apr-Jun, 2=Jul-Sep, 3=Okt-Des\n  const nowY = today.getFullYear();\n  const endYear = nowY + 3;\n\n  const labels = [];\n  let nowIdx = 0;\n  let year = START_YEAR, q = START_Q;\n\n  while(year < endYear){\n    const isNow = (year === nowY && q === nowQ);\n    const lbl = Q_LABELS[q] + ' ' + String(year).slice(-2);\n    if(isNow) nowIdx = labels.length;\n    labels.push(isNow ? lbl + '▼' : lbl);\n    q++;\n    if(q > 3){ q = 0; year++; }\n  }\n  return { labels, nowIdx, nowLabel: labels[nowIdx] };\n}\n\nconst TL = buildTimeline();\nconst LABELS = TL.labels;\nconst NOW_IDX = TL.nowIdx;\nconst NOW_LABEL = TL.nowLabel;\n\nconsole.log('📅 Today:', new Date().toISOString().slice(0,10));\nconsole.log('📅 NOW_IDX:', NOW_IDX, '→', NOW_LABEL);\nconsole.log('📅 Labels:', LABELS.join(' | '));\n\n// ── DEBUG STATE ───────────────────────────────────────\nconst DBG = {\n  source:'—', ticks:0, lastTick:0, wsState:'idle',\n  update(){\n    document.getElementById('dbg-src').textContent = this.source;\n    document.getElementById('dbg-ticks').textContent = this.ticks;\n    if(this.lastTick){\n      const age = ((Date.now()-this.lastTick)/1000).toFixed(1);\n      document.getElementById('dbg-last').textContent = new Date(this.lastTick).toLocaleTimeString('id-ID');\n      document.getElementById('dbg-age').textContent = age;\n    }\n    document.getElementById('dbg-usd').textContent = liveUSD ? '$'+liveUSD.toFixed(5) : '—';\n    document.getElementById('dbg-idr').textContent = liveIDR ? 'Rp'+Math.round(liveIDR) : '—';\n    document.getElementById('dbg-rate').textContent = idrRateCache ? 'Rp'+Math.round(idrRateCache)+'/USD' : '—';\n    document.getElementById('dbg-ws').textContent = this.wsState;\n    document.getElementById('dbg-tape').textContent = tapePrices.length;\n    document.getElementById('dbg-now-label').textContent = NOW_LABEL + ' (idx ' + NOW_IDX + ')';\n    document.getElementById('dbg-today').textContent = new Date().toLocaleString('id-ID');\n  }\n};\nsetInterval(()=>DBG.update(), 1000);\n\n// ── LIVE TAPE ─────────────────────────────────────────\nconst TAPE_MAX = 60;\nconst tapePrices = [];\nconst tapeTimes  = [];\nlet tapeMin = Infinity, tapeMax = -Infinity;\n\nfunction pushTape(priceIdr){\n  if(!isFinite(priceIdr) || priceIdr <= 0) return;\n  tapePrices.push(priceIdr);\n  tapeTimes.push(new Date());\n  if(tapePrices.length > TAPE_MAX){ tapePrices.shift(); tapeTimes.shift(); }\n  tapeMin = Math.min(...tapePrices);\n  tapeMax = Math.max(...tapePrices);\n  renderTape();\n}\n\nfunction renderTape(){\n  if(!tapeChartInst) return;\n  const labels = tapeTimes.map(t => t.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'}));\n  tapeChartInst.data.labels = labels;\n  tapeChartInst.data.datasets[0].data = tapePrices.slice();\n\n  const dEl = document.getElementById('tape-delta');\n  if(tapePrices.length >= 2){\n    const d = tapePrices[tapePrices.length-1] - tapePrices[0];\n    dEl.textContent = (d>=0?'+':'') + 'Rp' + Math.round(Math.abs(d));\n    dEl.style.color = d>=0 ? 'var(--green)' : 'var(--red)';\n  }\n  document.getElementById('tape-min').textContent = tapeMin<Infinity ? 'Rp'+Math.round(tapeMin) : '—';\n  document.getElementById('tape-max').textContent = tapeMax>-Infinity ? 'Rp'+Math.round(tapeMax) : '—';\n  document.getElementById('tape-count').textContent = tapePrices.length;\n\n  if(tapePrices.length >= 2){\n    const up = tapePrices[tapePrices.length-1] >= tapePrices[0];\n    tapeChartInst.data.datasets[0].borderColor = up ? '#00a884' : '#e63946';\n    tapeChartInst.data.datasets[0].backgroundColor = up ? 'rgba(0,168,132,0.10)' : 'rgba(230,57,70,0.10)';\n  }\n  tapeChartInst.update('none');\n}\n\nfunction buildTapeChart(){\n  const ctx = document.getElementById('tapeChart').getContext('2d');\n  tapeChartInst = new Chart(ctx, {\n    type:'line',\n    data:{labels:[],datasets:[{\n      label:'SPX/IDR', data:[],\n      borderColor:'#00a884', backgroundColor:'rgba(0,168,132,0.10)',\n      borderWidth:2, pointRadius:0, fill:true, tension:0.25, spanGaps:true\n    }]},\n    options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},\n      interaction:{mode:'index',intersect:false},\n      plugins:{legend:{display:false},tooltip:{backgroundColor:'#ffffff',borderColor:'rgba(20,20,50,0.12)',borderWidth:1,titleColor:'#888',bodyColor:'#181828',titleFont:{family:'Space Mono',size:9},bodyFont:{family:'Space Mono',size:9},callbacks:{label:c=>{\n        const v = c.parsed.y;\n        const usd = liveUSD && liveIDR ? v/(liveIDR/liveUSD) : v/IDR_FALLBACK;\n        return ` Rp${fmt(v)} (~$${usd.toFixed(5)})`;\n      }}}},\n      scales:{x:{ticks:{color:'#888',font:{family:'Space Mono',size:8},maxRotation:0,autoSkip:true,maxTicksLimit:6},grid:{color:'rgba(20,20,50,0.05)'}},y:{ticks:{color:'#888',font:{family:'Space Mono',size:8},callback:v=>'Rp'+fmt(v)},grid:{color:'rgba(20,20,50,0.05)'}}}\n    }\n  });\n}\n\n// ══════════════════════════════════════════════════════\n// DATA HISTORIS — extended ke kuarter terkini\n// ══════════════════════════════════════════════════════\n// Historis SPX USD per kuarter (indeks sama dgn LABELS)\n// Index 0=Okt23, 1=Jan24, ..., 8=Okt25 (last verified), 9+=extended\nconst HIST_USD_RAW = [0.011,0.012,0.020,0.011,0.913,0.866,0.520,2.27,0.780];\nconst BTC_HIST_RAW = [34000,42000,65000,57000,73000,98000,83000,100000,126000];\n\n// Extend otomatis: setelah index 8, isi dengan interpolasi turun ke live\nfunction buildHistUSD(totalLen){\n  const arr = HIST_USD_RAW.slice();\n  const last = HIST_USD_RAW[HIST_USD_RAW.length-1]; // 0.780\n  const target = liveUSD || 0.30;\n  const span = NOW_IDX - (HIST_USD_RAW.length-1);\n  for(let i = HIST_USD_RAW.length; i <= NOW_IDX; i++){\n    const t = (i - (HIST_USD_RAW.length-1)) / Math.max(span, 1);\n    arr[i] = last + (target - last) * t;\n  }\n  while(arr.length < totalLen) arr.push(null);\n  return arr;\n}\n\nfunction buildBtcHist(totalLen){\n  const arr = BTC_HIST_RAW.slice();\n  const last = BTC_HIST_RAW[BTC_HIST_RAW.length-1];\n  const target = 85000;\n  const span = NOW_IDX - (BTC_HIST_RAW.length-1);\n  for(let i = BTC_HIST_RAW.length; i <= NOW_IDX; i++){\n    const t = (i - (BTC_HIST_RAW.length-1)) / Math.max(span, 1);\n    arr[i] = Math.round(last + (target - last) * t);\n  }\n  while(arr.length < totalLen) arr.push(null);\n  return arr;\n}\n\nconst HIST_USD = buildHistUSD(LABELS.length);\nconst BTC_HIST_USD = buildBtcHist(LABELS.length);\n\n// ── SCENARIO DATA ─────────────────────────────────────\n// Skenario array di-index dari Okt 23. Nilai proyeksi mulai dari index 10.\n// Kalau NOW_IDX > 10, bagian masa lalu tetap ditampilkan (visual gap)\nconst SC = {\n  1:{color:'#6c5ce7',\n    usd:[null,null,null,null,null,null,null,null,null,null,0.380,1.20,2.80,5.00,3.50,2.00,1.50,1.80,3.50,8.00,12.00,9.00],\n    milestones:[\n      {label:'Q4 2026',usd:0.38,desc:'Konsolidasi'},\n      {label:'Q1 2027',usd:1.20,desc:'Breakev ───────────────────────────────\nasync function fetchPrice(manual=false){\n  if(manual) countdown=60;\n  const dot=document.getElementById('pulse-dot');\n  try{\n    const url='https://api.coingecko.com/api/v3/simple/price?ids=spx6900&vs_currencies=usd,idr&include_24hr_change=true';\n    const res=await fetch(url,{signal:AbortSignal.timeout(8000)});\n    if(!res.ok) throw new Error('HTTP '+res.status);\n    const d=(await res.json())['spx6900'];\n    if(!d) throw new Error('no data');\n    if(d.usd && d.idr) idrRateCache = d.idr / d.usd;\n\n    if(!wsConn || wsConn.readyState !== 1){\n      prevUSD = liveUSD;\n      liveUSD=d.usd; liveIDR=d.idr; live24h=d.usd_24h_change;\n      if(prevUSD !== liveUSD && liveUSD !== null){\n        pushTape(liveIDR || liveUSD*IDR_FALLBACK);\n      }\n      DBG.source = 'coingecko-poll';\n      DBG.lastTick = Date.now();\n      DBG.ticks++;\n      updateUI(); updateNowPoint(); updateMainChart(); updateAnonCharts();\n      renderProjCards(currentS); renderTargetCards(); renderImplied();\n    } else if(idrRateCache){\n      liveIDR = liveUSD * idrRateCache;\n    }\n    document.getElementById('err-banner').style.display='none';\n    dot.style.background='var(--green)';\n  }catch(e){\n    console.warn('fetchPrice err', e);\n    dot.style.background='var(--red)';\n    document.getElementById('err-banner').style.display='block';\n    if(liveUSD) updateUI();\n  }\n  document.getElementById('last-update').textContent='synced '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});\n}\n\nfunction startTimer(){\n  if(timer) clearInterval(timer);\n  countdown=60;\n  timer=setInterval(()=>{\n    countdown--;\n    document.getElementById('countdown').textContent='sync in '+countdown+'s';\n    if(countdown<=0){countdown=60;fetchPrice(false);}\n  },1000);\n}\n\n// ── WS CHAIN ──────────────────────────────────────────\nlet wsConn = null;\nlet wsGotData = false;\nlet wsOpenTimer = null;\nlet wsReconnectTimer = nul +idx].data=idrProj;\n  });\n  mainChartInst.data.datasets[6].data=LABELS.map(()=>Math.round(AVG_IDR));\n  if(mainChartInst.data.datasets[7]) mainChartInst.data.datasets[7].data=liveLine;\n  mainChartInst.update('none');\n}\n\n// ── ANON DUAL CHARTS ──────────────────────────────────\nfunction buildAnonCharts(){\n  const btcCtx=document.getElementById('btcAnonChart').getContext('2d');\n  if(btcChartInst) btcChartInst.destroy();\n  btcChartInst=new Chart(btcCtx,{\n    type:'line',\n    data:{labels:LABELS,datasets:[\n      {label:'BTC Hist',data:BTC_HIST_USD.map(v=>v),borderColor:'rgba(232,133,10,0.55)',borderWidth:1.5,pointRadius:0,fill:false,tension:0.4,spanGaps:false},\n      {label:'BTC Anon',data:SC[4].btcUSD.map(v=>v),borderColor:'#e8850a',borderWidth:2.5,borderDash:[6,4],pointRadius:0,fill:false,tension:0.4,spanGaps:false},\n      {label:'NOW',data:LABELS.map((_,i)=>i===NOW_IDX?85000:null),borderColor:'transparent',pointRadius:LABELS.map((_,i)=>i===NOW_IDX?6:0),pointBackgroundColor:'#e63946',fill:false,spanGaps:false}\n    ]},\n    options:{responsive:true,maintainAspectRatio:false,animation:{duration:0},\n      plugins:{legend:{display:false},tooltip:{backgroundColor:'#ffffff',borderColor:'rgba(20,20,50,0.12)',borderWidth:1,titleColor:'#888',bodyColor:'#181828',titleFont:{family:'Space Mono',size:8},bodyFont:{family:'Space Mono',size:8},callbacks:{label:c=>c.parsed.y?` $${new Intl.NumberFormat().format(Math.round(c.parsed.y))}`:null}}},\n      scales:{x:{ticks:{color:'#888',font:{family:'Space Mono',size:8},maxRotation:45,autoSkip:true,maxTicksLimit:8},grid:{color:'rgba(20,20,50,0.05)'}},y:{ticks:{color:'#888',font:{family:'Space Mono',size:8},callback:v=>{const n=[30000,50000,85000,100000,150000,190000];return n.includes(v)?'$'+new Intl.NumberFormat().format(v):null}},grid:{color:'rgba(20,20,50,0.05)'}}}\n    }\n  });\n\n  const spxCtx=document.getElementById('spxAnonChart').getContext('2d');\n  const nowIDR=Math.round(liveIDR||((liveUSD||0.30)*IDR_FALLBACK)) ont:{family:'Space Mono',size:8},callback:v=>{const n=[1000,5000,16937,50000,100000,200000];return n.includes(v)?'Rp'+fmt(v):null}},grid:{color:'rgba(20,20,50,0.05)'}}}\n    }\n  });\n}\n\nfunction updateAnonCharts(){\n  if(!spxAnonChartInst) return;\n  const nowIDR=Math.round(liveIDR||((liveUSD||0.30)*IDR_FALLBACK));\n  const spxAnonIdr=SC[4].usd.map(v=>v!==null?Math.round(getIdr(v)):null);\n  const liveLine=LABELS.map(()=>nowIDR);\n  spxAnonChartInst.data.datasets[1].data=spxAnonIdr;\n  spxAnonChartInst.data.datasets[3].data=LABELS.map((_,i)=>i===NOW_IDX?nowIDR:null);\n  if(spxAnonChartInst.data.datasets[4]) spxAnonChartInst.data.datasets[4].data=liveLine;\n  spxAnonChartInst.update('none');\n}\n\n// ── PROJ CARDS ────────────────────────────────────────\nfunction renderProjCards(sn){\n  document.getElementById('proj-lbl').textContent=`PROYEKSI PORTOFOLIO — S${sn} (dari ${NOW_LABEL.replace('▼','')})`;\n  const container=document.getElementById('proj-grid');\n  container.innerHTML=SC[sn].milestones.map(m=>{\n    const idr=getIdr(m.usd);const pv=HOLDINGS*idr;const pl=pv-MODAL;const plPct=(pl/MODAL*100);\n    const isP=pl>=0;const acol=isP?'var(--green)':'var(--red)';\n    return`<div class=\"proj-card\" style=\"border-color:${isP?'rgba(0,168,132,0.25)':'rgba(230,57,70,0.18)'}\">\n      <div style=\"position:absolute;top:0;left:0;right:0;height:2px;background:${SC[sn].color}\"><\/div>\n      <div class=\"pj-lbl\">${m.label} · ${m.desc}<\/div>\n      <div class=\"pj-idr\" style=\"color:${acol}\">Rp${fmt(pv)}<\/div>\n      <div class=\"pj-usd\">@ $${m.usd.toFixed(2)} · Rp${fmt(idr)}<\/div>\n      <div class=\"pj-pnl\" style=\"color:${acol}\">${isP?'+':''}Rp${fmt(Math.abs(pl))} (${fmtPct(plPct)})<\/div>\n      <div class=\"pj-note\">${isP?'✓ PROFIT':'✗ MASIH LOSS'}<\/div>\n    <\/div>`;\n  }).join('');\n}\n\nfunction renderTargetCards(){\n  const targets=[\n    {label:'Breakeven',usd:AVG_IDR/getIdr(1)*1,note:'Balik modal'},\n    {label:'SPX $1',usd:1.0,note:'Pertama $1'},\n    {label:'SPX $2',usd:2.0,note:'Altseason entry'},\n    {label:'SPX $7.50',usd:7.50,note:'Anon S4 target'},\n    {label:'SPX $12',usd:12.0,note:'Anon peak implied'},\n    {label:'SPX $20',usd:20.0,note:'Murad range'},\n  ];\n  const beUSD=AVG_IDR/(liveIDR&&liveUSD?liveIDR/liveUSD:IDR_FALLBACK);\n  targets[0].usd=beUSD;\n  const container=document.getElementById('target-grid');\n  container.innerHTML=targets.map(t=>{\n    const idr=getIdr(t.usd);const pv=HOLDINGS*idr;const pl=pv-MODAL;const plPct=(pl/MODAL*100);\n    const isP=pl>=0;const acol=isP?'var(--green)':'var(--red)';\n    return`<div class=\"proj-card\">\n      <div class=\"pj-lbl\">${t.label}<\/div>\n      <div class=\"pj-idr\" style=\"color:${acol}\">Rp${fmt(pv)}<\/div>\n      <div class=\"pj-usd\">@ $${t.usd.toFixed(2)} · Rp${fmt(idr)}<\/div>\n      <div class=\"pj-pnl\" style=\"color:${acol}\">${isP?'+':''}Rp${fmt(Math.abs(pl))} (${fmtPct(plPct)})<\/div>\n      <div class=\"pj-note\">${t.note}<\/div>\n    <\/div>`;\n  }).join('');\n}\n\nfunction setS(n,el){\n  currentS=n;\n  document.querySelectorAll('.tab').forEach(t=>t.className='tab');\n  el.className=`tab a${n}`;\n  document.querySelectorAll('.sc-info').forEach(c=>c.classList.remove('vis'));\n  document.getElementById(`si${n}`).classList.add('vis');\n  if(mainChartInst){\n    [1,2,3,4].forEach((sn,idx)=>{\n      mainChartInst.data.datasets[2+idx].borderColor=sn===n?SC[sn].color:SC[sn].color+'33';\n      mainChartInst.data.datasets[2+idx].borderWidth=sn===n?2.5:1;\n    });\n    mainChartInst.update('none');\n  }\n  renderProjCards(n);\n}\n\n// ── INIT ──────────────────────────────────────────────\nwindow.addEventListener('load',()=>{\n  // Set dynamic NOW label di header chart\n  document.getElementById('now-lbl-display').textContent = NOW_LABEL;\n\n  buildTapeChart();\n  buildMainChart();\n  buildAnonCharts();\n  renderImplied();\n  renderProjCards(1);\n  renderTargetCards();\n  fetchPrice(true);\n  startTimer();\n  tryWs(0);\n});\n\nwindow.addEventListener('beforeunload', ()=>{\n  if(wsConn){ try{ wsConn.close(); }catch(e){} }\n});\n<\/script>\n<\/body>\n<\/html>"};
const keys=Object.keys(APPS), loaded={};
function show(k){
  if(!APPS[k])k='fuel';
  if(!loaded[k]){
    const p=document.createElement('div');p.className='pane';p.id='p-'+k;
    const f=document.createElement('iframe');f.title=k;
    f.setAttribute('allow','clipboard-write');
    f.srcdoc=APPS[k];p.appendChild(f);document.getElementById('panes').appendChild(p);loaded[k]=p;
  }
  keys.forEach(x=>{if(loaded[x])loaded[x].classList.toggle('on',x===k)});
  document.querySelectorAll('.t').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  try{history.replaceState(null,'','#'+k)}catch(e){}
  // chart di dalam iframe perlu tahu ukuran baru setelah tab ditampilkan
  setTimeout(()=>{try{loaded[k].querySelector('iframe').contentWindow.dispatchEvent(new Event('resize'))}catch(e){}},150);
}
document.querySelectorAll('.t').forEach(b=>b.addEventListener('click',()=>show(b.dataset.k)));
show(location.hash.slice(1)||'fuel');
</script></body></html>
